model:
  target_model_path: "Qwen/Qwen2.5-7B-Instruct"
  draft_model_config:
    schema_version: 1
    hidden_size: 3584
    num_hidden_layers: 1
    num_attention_heads: 28
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 152064
    intermediate_size: 18944
    max_position_embeddings: 32768
    num_key_value_heads: 4
    architectures:
    - LlamaForCausalLMEagle3
    model_type: llama
    rope_scaling: null
    rope_theta: 1000000.0
    torch_dtype: bfloat16
    transformers_version: 4.51.0
    draft_vocab_size: 16000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 13
      - 24
    layers:
      attention:
        type: gqa
        is_causal: true
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  vocab_mapping_path: "./cache/vocab_mapping/qwen2.5-7b-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  hidden_states_path: "./cache/hidden_states/qwen2.5-7b"
  max_length: 4096
  chat_template: "qwen"
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.00005
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "qwen2.5-7b-eagle3-offline-disaggregated"
output_dir: "./outputs/qwen2.5-7b-eagle3-offline-disaggregated"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen2.5-7b-eagle3-offline-disaggregated/control
    backend: shared_dir
    store_root: outputs/qwen2.5-7b-eagle3-offline-disaggregated/features
