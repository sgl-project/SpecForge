model:
  target_model_path: Qwen/Qwen2.5-7B-Instruct
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  vocab_mapping_path: ./cache/vocab_mapping/qwen2.5-7b-eagle3.pt
  torch_dtype: bfloat16
data:
  hidden_states_path: ./cache/hidden_states/qwen2.5-7b
  max_length: 4096
  chat_template: qwen
  cache_dir: ./cache
training:
  num_epochs: 10
  batch_size: 1
  learning_rate: 5.0e-05
  max_grad_norm: 0.5
  attention_backend: flex_attention
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
  objective_options:
    ttt_length: 7
run_id: qwen2.5-7b-eagle3-offline-disaggregated
output_dir: ./outputs/qwen2.5-7b-eagle3-offline-disaggregated
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen2.5-7b-eagle3-offline-disaggregated/control
    backend: shared_dir
    store_root: outputs/qwen2.5-7b-eagle3-offline-disaggregated/features
draft: specforge/config/draft/presets/qwen2.5-7b-eagle3.yaml
