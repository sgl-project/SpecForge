model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    schema_version: 1
    hidden_size: 4096
    num_hidden_layers: 1
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 151936
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - LlamaForCausalLMEagle3
    model_type: llama
    rope_scaling: null
    rope_theta: 1000000
    torch_dtype: bfloat16
    transformers_version: 4.51.0
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 17
      - 32
    layers:
      attention:
        type: gqa
        is_causal: true
  vocab_mapping_path: cache/vocab_mapping/qwen3-8b.pt
data:
  hidden_states_path: cache/hidden_states/qwen3-8b
  max_length: 4096
training:
  strategy: eagle3
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.0001
  ttt_length: 7
  save_interval: 5000
  dist_timeout: 20
  seed: 0
run_id: qwen3-8b-eagle3-offline-disaggregated
output_dir: outputs/qwen3-8b-eagle3-offline-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3-8b-eagle3-offline-disaggregated/control
    backend: shared_dir
    store_root: outputs/qwen3-8b-eagle3-offline-disaggregated/features
