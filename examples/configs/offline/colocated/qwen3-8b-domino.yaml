model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    schema_version: 1
    hidden_size: 4096
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 151936
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_key_value_heads: 8
    head_dim: 128
    emb_dim: 256
    architectures:
    - DominoDraftModel
    auto_map:
      AutoModel: domino.DominoDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 151669
      target_layer_ids:
      - 1
      - 9
      - 17
      - 25
      - 33
      projector_type: domino
      pure_draft_prefix_len: 1
      emb_dim: 256
      gru_hidden_dim: 1024
      shift_label: true
    model_type: qwen3
    num_target_layers: 36
    rope_scaling: null
    rope_theta: 1000000
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-domino-sharegpt
  max_length: 3072
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: domino
  num_epochs: 6
  batch_size: 2
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 256
  loss_decay_gamma: 7.0
  lambda_base_start: 1.0
  lambda_base_decay_ratio: 1.0
  save_interval: 2000
  log_interval: 50
  dist_timeout: 30
  seed: 42

run_id: qwen3-8b-domino-offline
output_dir: ./outputs/qwen3-8b-domino-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
