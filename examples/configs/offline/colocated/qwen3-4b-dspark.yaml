model:
  target_model_path: Qwen/Qwen3-4B
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
data:
  hidden_states_path: ./cache/hidden_states/qwen3-4b-dspark-sharegpt
  max_length: 3072
  chat_template: qwen
  cache_dir: ./cache
training:
  loss:
    fused: true
  num_epochs: 6
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42
  objective_options:
    num_anchors: 512
run_id: qwen3-4b-dspark-offline
output_dir: ./outputs/qwen3-4b-dspark-offline
deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
draft: specforge/config/draft/presets/qwen3-4b-dspark.yaml
