model:
  target_model_path: "inclusionAI/Ling-flash-2.0"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    bos_token_id: 163584
    eos_token_id: 163585
    hidden_act: silu
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 14336
    max_position_embeddings: 32768
    model_type: llama
    num_attention_heads: 32
    num_key_value_heads: 8
    num_hidden_layers: 1
    pad_token_id: 0
    rms_norm_eps: 1.0e-05
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.57.1
    use_cache: true
    vocab_size: 157184
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 15, 28]
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.word_embeddings.weight"
  vocab_mapping_path: "./cache/vocab_mapping/ling-flash-2.0-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  hidden_states_path: "./cache/hidden_states/perfect-blend-ling-flash-2.0"
  max_length: 2048
  chat_template: "ling-flash-2.0"
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.00005
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  tp_size: 1
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "ling-flash-2.0-eagle3-offline"
output_dir: "./outputs/ling-flash-2.0-eagle3-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 8
