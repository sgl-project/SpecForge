model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    architectures: [DSparkDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    block_size: 7
    bos_token_id: 151643
    dflash_config:
      attention_mode: gqa
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 151669
      projector_type: dspark
      target_layer_ids: [1, 9, 17, 25, 33]
    dtype: bfloat16
    eos_token_id: 151645
    head_dim: 128
    hidden_act: silu
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 12288
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 40960
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 36
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 151936
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-dspark-sharegpt
  max_length: 3072
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: dspark
  num_epochs: 6
  max_steps: 10000
  batch_size: 1
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42

run_id: qwen3-8b-dspark-offline
output_dir: ./outputs/qwen3-8b-dspark-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
