model:
  target_model_path: "Qwen/Qwen3.5-35B-A3B"
  draft_model_config:
    schema_version: 1
    hidden_size: 2048
    num_hidden_layers: 1
    num_attention_heads: 16
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 248044
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 248320
    intermediate_size: 16384
    max_position_embeddings: 262144
    num_key_value_heads: 2
    head_dim: 256
    architectures:
    - LlamaForCausalLMEagle3
    decoder_sparse_step: 1
    model_type: llama
    rope_scaling: null
    rope_theta: 10000000
    torch_dtype: bfloat16
    transformers_version: 4.57.0.dev0
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 19
      - 36
    layers:
      attention:
        type: gqa
        is_causal: true
  target_backend: "sglang"
  embedding_key: "model.language_model.embed_tokens.weight"
  vocab_mapping_path: "./cache/vocab_mapping/qwen3.5-35b-a3b-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  hidden_states_path: "./cache/hidden_states/qwen3.5-35b-a3b-ultrachat"
  max_length: 4096
  chat_template: "qwen"
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.00005
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "qwen3.5-35b-a3b-eagle3-offline"
output_dir: "./outputs/qwen3.5-35b-a3b-eagle3-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 4
