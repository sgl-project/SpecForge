# Qwen3.5-4B DFlash draft, offline (features captured to disk) — AMD ROCm.
# Trainer runs on ROCm unchanged (flex_attention). Capture the hidden states with
# scripts/prepare_hidden_states.py using the AITER + --sglang-disable-radix-cache
# flags (see docs/sections/basic_usage/AMD/amd_rocm.md, Section 3).
model:
  target_model_path: "Qwen/Qwen3.5-4B"
  draft_model_config:
    architectures: [DFlashDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    bos_token_id: 248043
    dflash_config:
      mask_token_id: 248070
      target_layer_ids: [1, 8, 15, 22, 29]
    dtype: bfloat16
    eos_token_id: 248044
    head_dim: 128
    hidden_act: silu
    hidden_size: 2560
    initializer_range: 0.02
    intermediate_size: 9728
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 262144
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 32
    pad_token_id: 248044
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 10000000
    sliding_window: null
    tie_word_embeddings: true
    transformers_version: 4.57.1
    use_cache: true
    use_sliding_window: false
    vocab_size: 248320
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  # Liger fused RMSNorm/SwiGLU: validated on MI355X (+10% tokens/s, -15% peak
  # mem, loss parity). Requires the flex-backend fix (torch<2.11) to run. Also
  # the ROCm default; install it with
  # `pip install --no-deps "liger-kernel>=0.8.3,<0.9"`.
  use_liger_kernel: true
data:
  hidden_states_path: "./cache/hidden_states/qwen3.5-4b-dflash-sharegpt"
  max_length: 2048
  chat_template: "qwen3.5"
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-4b-dflash-offline"
output_dir: "./outputs/qwen3.5-4b-dflash-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
