# Qwen3.5-4B DFlash draft, offline (features captured to disk) — AMD ROCm.
# Trainer runs on ROCm unchanged (flex_attention). Capture the hidden states with
# scripts/prepare_hidden_states.py using the AITER + --sglang-disable-radix-cache
# flags (see docs/sections/basic_usage/AMD/amd_rocm.md, Section 3).
model:
  target_model_path: "Qwen/Qwen3.5-4B"
  draft_model_config:
    schema_version: 1
    hidden_size: 2560
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 248044
    bos_token_id: 248043
    eos_token_id: 248044
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 248320
    intermediate_size: 9728
    max_position_embeddings: 262144
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - DFlashDraftModel
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 248070
      target_layer_ids:
      - 1
      - 8
      - 15
      - 22
      - 29
      projector_type: null
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 32
    rope_scaling: null
    rope_theta: 10000000
    transformers_version: 4.57.1
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  # Liger fused RMSNorm/SwiGLU: validated on MI355X (+10% tokens/s, -15% peak
  # mem, loss parity). Requires the flex-backend fix (torch<2.11) to run. Also
  # the ROCm default; install it with
  # `pip install --no-deps "liger-kernel>=0.8.3,<0.9"`.
  use_liger_kernel: true
data:
  hidden_states_path: "./cache/hidden_states/qwen3.5-4b-dflash-sharegpt"
  max_length: 2048
  chat_template: "qwen3.5"
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-4b-dflash-offline"
output_dir: "./outputs/qwen3.5-4b-dflash-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
