model:
  target_model_path: Qwen/Qwen3.5-4B
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true
data:
  hidden_states_path: ./cache/hidden_states/qwen3.5-4b-dflash-sharegpt
  max_length: 2048
  chat_template: qwen3.5
  cache_dir: ./cache
training:
  loss:
    fused: true
  weighting:
    kind: exponential
    gamma: 7
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: flex_attention
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42
  objective_options:
    num_anchors: 512
tracking:
  report_to: tensorboard
run_id: qwen3.5-4b-dflash-offline
output_dir: ./outputs/qwen3.5-4b-dflash-offline
deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
draft: specforge/config/draft/presets/qwen3.5-4b-dflash.yaml
