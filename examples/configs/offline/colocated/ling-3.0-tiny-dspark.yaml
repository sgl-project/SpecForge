model:
  target_model_path: inclusionAI/Ling-3.0-tiny
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.word_embeddings.weight
  torch_dtype: bfloat16
data:
  hidden_states_path: ./cache/hidden_states/ling-3.0-tiny-dspark
  max_length: 4096
  chat_template: ling-3.0
  cache_dir: ./cache
training:
  loss:
    fused: true
  num_epochs: 20
  batch_size: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  save_interval: 1000
  log_interval: 50
  dist_timeout: 30
  seed: 42
  objective_options:
    num_anchors: 128
run_id: ling-3.0-tiny-dspark-offline
output_dir: ./outputs/ling-3.0-tiny-dspark-offline
deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
draft: specforge/config/draft/presets/ling-3.0-tiny-dspark.yaml
