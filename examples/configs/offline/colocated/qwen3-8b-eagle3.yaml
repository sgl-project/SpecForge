model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    head_dim: 128
    hidden_act: silu
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 12288
    max_position_embeddings: 40960
    max_window_layers: 36
    model_type: llama
    num_attention_heads: 32
    num_hidden_layers: 1
    num_key_value_heads: 8
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: null
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.51.0
    use_cache: true
    use_sliding_window: false
    vocab_size: 151936
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 17, 32]
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  vocab_mapping_path: ./cache/vocab_mapping/qwen3-8b-eagle3.pt
  torch_dtype: bfloat16

data:
  hidden_states_path: ./cache/hidden_states/qwen3-8b-sharegpt
  max_length: 4096
  chat_template: qwen
  cache_dir: ./cache

training:
  strategy: eagle3
  num_epochs: 10
  batch_size: 1
  learning_rate: 1.0e-4
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: flex_attention
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0

run_id: qwen3-8b-eagle3-offline
output_dir: ./outputs/qwen3-8b-eagle3-offline

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
