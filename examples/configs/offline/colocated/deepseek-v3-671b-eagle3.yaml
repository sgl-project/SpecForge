model:
  target_model_path: "deepseek-ai/DeepSeek-V3"
  draft_model_config:
    schema_version: 1
    hidden_size: 7168
    num_hidden_layers: 1
    num_attention_heads: 56
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-05
    pad_token_id: 0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 129280
    intermediate_size: 40960
    max_position_embeddings: 163840
    num_key_value_heads: 8
    architectures:
    - LlamaForCausalLMEagle3
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 29
      - 57
      use_aux_hidden_state: true
    model_type: llama
    torch_dtype: float16
    transformers_version: 4.51.0
    draft_vocab_size: 32000
    layers:
      attention:
        type: gqa
        is_causal: true
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  vocab_mapping_path: "./cache/vocab_mapping/deepseek-v3-671b-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  hidden_states_path: "./cache/hidden_states/perfect-blend-deepseek-v3"
  max_length: 2048
  chat_template: "deepseek-v3"
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.00005
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  tp_size: 1
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "deepseek-v3-671b-eagle3-offline"
output_dir: "./outputs/deepseek-v3-671b-eagle3-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 8
