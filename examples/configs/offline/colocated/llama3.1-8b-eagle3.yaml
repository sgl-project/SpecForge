model:
  target_model_path: "meta-llama/Llama-3.1-8B-Instruct"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 14336
    max_position_embeddings: 2048
    model_type: llama
    num_attention_heads: 32
    num_key_value_heads: 8
    num_hidden_layers: 1
    pad_token_id: 0
    rms_norm_eps: 1.0e-05
    tie_word_embeddings: false
    torch_dtype: float16
    transformers_version: 4.28.1
    use_cache: true
    vocab_size: 128256
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 15, 28]
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  vocab_mapping_path: "./cache/vocab_mapping/llama3.1-8b-eagle3.pt"
  torch_dtype: "bfloat16"
data:
  hidden_states_path: "./cache/hidden_states/sharegpt_train_Llama-3.1-8B-Instruct"
  max_length: 4096
  chat_template: "llama3"
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "sdpa"
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "llama3.1-8b-eagle3-offline"
output_dir: "./outputs/llama3.1-8b-eagle3-offline"

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 1
