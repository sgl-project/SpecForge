model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  # OFFICIAL drafter architecture: 3 DeepSeek-V4 MoE+mHC stages (mtp.*),
  # block_size 5, capture layers [40, 41, 42] - matches the DSpark head
  # bundled with the 0731 checkpoint, unlike the 5-layer Qwen3 approximation
  # in deepseek-v4-flash-dspark-2node-h200.yaml.
  draft_model_config: configs/deepseek-v4-flash-dspark-official.json
  # Weights-only warm start from the r1 run's last healthy checkpoint —
  # r1 (target-layers init, lr 6e-4, warmup 0.02) surpassed the old baseline
  # (pos0 acc 0.63 vs 0.49) but diverged to NaN between steps 1210-1220
  # (grad norm 0.40 -> 2.45 -> 3.49 -> nan). r2 continues from step1152 at
  # half the LR with a tighter clip.
  draft_checkpoint_path: outputs/deepseek-v4-flash-dspark-official-2node-h200/deepseek-v4-flash-dspark-official-2node-h200-step1152
  target_backend: sglang
  trust_remote_code: true
  # DeepSeek-V4 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.85
  # data.max_length plus headroom: capture rejects inputs at exactly the
  # context length.
  sglang_context_length: 8704
  sglang_max_running_requests: 8
  # H200 (SM90) has no native FP4 tensor cores; the checkpoint's fp4 routed
  # experts run through the W4A16 Marlin MoE path (the flashinfer_mxfp4
  # TRT-LLM path used on B200 is SM100-only).
  sglang_moe_runner_backend: marlin

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 8192
  chat_template: deepseek-v4
  cache_dir: cache
  build_dataset_num_proc: 64
  dataloader_num_workers: 8

training:
  strategy: dspark
  # r1 covered ~1.2 epochs before diverging; one more epoch from step1152.
  num_epochs: 1
  # Eight consumer ranks x one sequence x 16 microbatches -> a global batch of
  # 128 sequences per optimizer step (same quantum as the baseline recipe).
  batch_size: 1
  accumulation_steps: 16
  learning_rate: 0.0003
  lr_scheduler: constant
  # The baseline run (no warmup, constant 6e-4) diverged to NaN at step ~1380;
  # a short warmup is cheap insurance for the from-scratch MoE heads. The
  # DSpark paper does not specify an LR schedule.
  warmup_ratio: 0.01
  max_grad_norm: 0.5
  # ~19.9B drafter: shard params+grads+optimizer states across the 8 ranks.
  fsdp_sharding: FULL_SHARD
  # no_sync accumulation would hold ~40 GiB of UNSHARDED grads per rank
  # across the 16 microbatches; reduce-scatter every micro-step instead.
  fsdp_no_sync_grad_accum: false
  # DSparkV4DraftModel implements the official window/block attention pattern
  # itself; the wrapper builds no masks.
  attention_backend: native
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 128
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge-deepseek-v4-flash
  wandb_name: deepseek-v4-flash-dspark-official-2node-h200-r2
  # The trainer node has no wandb credentials; offline runs land in wandb_dir
  # (shared GPFS) for a later `wandb sync`.
  wandb_offline: true
  wandb_dir: outputs/deepseek-v4-flash-dspark-official-2node-h200-r2/wandb

runtime:
  producer_lease: 8
  # Four TP2 capture servers x 8 running requests: enough client concurrency
  # to keep every server's prefill queue full.
  producer_concurrency: 16
  # One 8K sample is ~0.25 GiB of BF16 DSpark features with THREE capture
  # layers ((3 aux + 1 last-hidden) x 4096 x bf16 = 32 KB/token; the 5-layer
  # baseline was ~0.4 GiB). A complete optimizer quantum is 128 samples
  # (~32 GiB). Same quanta ratios as the baseline recipe: two quanta in
  # flight, low watermark at ~two quanta of bytes.
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 85899345920
  resident_low_watermark_bytes: 64424509440
  feature_store_max_resident_bytes: 107374182400

run_id: deepseek-v4-flash-dspark-official-2node-h200-r2
output_dir: outputs/deepseek-v4-flash-dspark-official-2node-h200-r2

# Two-node split on this cluster:
#   10.220.51.50 (capture node): mooncake_master + four TP2 capture servers
#     on GPUs 0-7 with --spec-capture-aux-layer-ids 40 41 42.
#   10.220.51.52 (trainer node): this config, `specforge train` single
#     supervisor = CPU producer + eight-rank FSDP consumer on GPUs 0-7.
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/deepseek-v4-flash-dspark-official-2node-h200-r2/control
    consumer_state_dir: outputs/deepseek-v4-flash-dspark-official-2node-h200-r2/consumer-state
    backend: mooncake
    store_id: deepseek-v4-flash-dspark-official-2node-h200-r2
    server_urls:
      - http://10.220.51.50:30000
      - http://10.220.51.50:30001
      - http://10.220.51.50:30002
      - http://10.220.51.50:30003
    mooncake_metadata_server: http://10.220.51.50:35880/metadata
    mooncake_master_server_addr: 10.220.51.50:35551
    # The trainer node's own routable address (Mooncake TCP data plane
    # endpoint registered by this side's clients).
    mooncake_local_hostname: 10.220.51.52
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
