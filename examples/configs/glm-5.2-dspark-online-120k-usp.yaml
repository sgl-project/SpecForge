model:
  target_model_path: zai-org/GLM-5.2-FP8
  draft_model_config: configs/glm-5.2-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  train_data_path: ./cache/dataset/glm52_dspark_train.jsonl
  max_length: 120000
  chat_template: glm-5.2
  cache_dir: ./cache
  build_dataset_num_proc: 8

training:
  strategy: dspark
  num_epochs: 10
  batch_size: 1
  accumulation_steps: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: usp
  sp_ulysses_size: 8
  sp_ring_size: 1
  fsdp_sharding: FULL_SHARD
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 64
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42

runtime:
  producer_lease: 1
  in_flight_high_watermark: 8
  in_flight_low_watermark: 8
  resident_high_watermark_bytes: 103079215104
  resident_low_watermark_bytes: 68719476736
  feature_store_max_resident_bytes: 137438953472

run_id: glm-5.2-dspark-online-120k-usp
output_dir: ./outputs/glm-5.2-dspark-online-120k-usp

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/glm-5.2-dspark-online-120k-usp/control
    consumer_state_dir: outputs/glm-5.2-dspark-online-120k-usp/consumer-state
    backend: mooncake
    server_urls: [http://127.0.0.1:30000]
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
