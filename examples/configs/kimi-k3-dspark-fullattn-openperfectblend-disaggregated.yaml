model:
  # Exact target revision used by the reference run njyq006k.
  target_model_path: /workspace/models/Kimi-K3
  draft_model_config: configs/kimi-k3-dspark-fullattn-gqa16.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: language_model.model.embed_tokens.weight
  lm_head_key: language_model.lm_head.weight
  mask_token_id: 163824
  torch_dtype: bfloat16
  sglang_attention_backend: flashinfer
  sglang_mem_fraction_static: 0.76
  sglang_context_length: 4608
  sglang_max_running_requests: 16
  sglang_max_total_tokens: 73728
  sglang_moe_runner_backend: marlin
  sglang_enable_symm_mem: false
  sglang_mamba_radix_cache_strategy: extra_buffer
  sglang_max_mamba_cache_size: 80

data:
  # Prepared from skx618/Kimi-K3-OpenPerfectBlend-Regen@9caaf705...
  # after the reference structural gate: 499,591 source rows -> 469,695
  # trainable rows after the dataset builder's 14-token supervision gate.
  train_data_path: /workspace/k3_dspark/data/kimi-k3-openperfectblend-regen-9caaf705/prepared-4096.jsonl
  max_length: 4096
  chat_template: kimi-k3-thinking
  cache_dir: /workspace/k3_dspark/cache
  build_dataset_num_proc: 64
  # Materialize the next optimizer window while the current one trains.  This
  # hides Mooncake TCP transfer latency on the two-node DP16 topology.
  dataloader_num_workers: 4

training:
  strategy: dspark
  num_epochs: 10
  # floor(469,695 prompts * 10 epochs / global batch 512)
  total_steps: 9173
  # Preserve the source FSDP16 trainer shape: one sample on each of 16 ranks,
  # accumulated 32 times.  Keeping a DP8 consumer would preserve the global
  # batch mathematically but halve trainer compute and miss the source rate.
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 250
  # Keep the latest three portable DP16 checkpoints; relay archives remain as
  # an additional recovery source without duplicating every checkpoint tree.
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge-dspark
  wandb_name: kimi-k3-dspark-5layer-fullattn-reference-disaggregated
  wandb_offline: false
  wandb_dir: /workspace/k3_dspark/runs/kimi-k3-fullattn-reference/wandb

runtime:
  producer_lease: 16
  # Per endpoint: publish batch N while TP8 prefills batch N+1.
  producer_concurrency: 2
  in_flight_high_watermark: 1088
  in_flight_low_watermark: 640
  resident_high_watermark_bytes: 377957122048
  resident_low_watermark_bytes: 206158430208
  feature_store_max_resident_bytes: 412316860416

run_id: kimi-k3-dspark-5layer-fullattn-reference-disaggregated
output_dir: /workspace/k3_dspark/runs/kimi-k3-fullattn-reference/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 2
    nproc_per_node: 8
    master_addr: trainer-node-0
    master_port: 29500
  disaggregated:
    control_dir: /workspace/k3_dspark/runs/kimi-k3-fullattn-reference/control
    consumer_state_dir: /workspace/k3_dspark/runs/kimi-k3-fullattn-reference/consumer-state
    # Rank 0 relays tensor-free inbox metadata to the second trainer node.  The
    # target tensors continue to move directly through Mooncake.
    inbox_server_url: http://trainer-node-0:35900
    backend: mooncake
    store_id: kimi-k3-dspark-5layer-fullattn-reference-disaggregated
    server_urls:
      - http://capture-node-0:30000
      - http://capture-node-1:30000
    mooncake_metadata_server: http://10.65.0.2:35880/metadata
    mooncake_master_server_addr: 10.65.0.2:35551
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
