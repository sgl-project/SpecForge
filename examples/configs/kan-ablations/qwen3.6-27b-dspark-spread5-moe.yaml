# Kan's FFN ablation: Qwen3.6-27B target, spread5 capture layers
# ([2, 17, 32, 47, 62] of 64) with an MoE FFN in the draft (64 routed experts
# + 1 shared, top-6, moe_intermediate 2048 — the official DSpark MoE shape at
# a quarter of the expert count). Pair of qwen3.6-27b-dspark-spread5.yaml
# (the dense-FFN arm) — same data/hparams/global batch (128), only the draft
# JSON's MoE fields and the GPU layout differ. Owns the WHOLE node
# 10.13.114.102: 4x TP1 capture servers (GPUs 0-3, ports 30000/30002/30004/
# 30006) + 4-rank FSDP trainer (GPUs 4-7); mooncake on 35551/35880/35903.
# Runs after the dense qwen pair finishes. Weights load from /cluster-storage
# (virtiofs): launch with SPECFORGE_SERIAL_SERVICE_STARTUP=1 (concurrent
# shard opens can deadlock in fuse_open).
model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config: examples/configs/kan-ablations/qwen3.6-27b-dspark-spread5-moe.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 248070
  # Qwen3.6 is a hybrid GDN model; on Blackwell SGLang only allows
  # fa4/triton/trtllm_mha attention backends; fa4 rejects head_dim=256 on SM100.
  sglang_attention_backend: triton

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64

training:
  strategy: dspark
  num_epochs: 1
  # Four consumer ranks x one sequence x 32 microbatches -> a global batch
  # of 128, the same optimizer quantum as the dense arm (~940 steps/epoch).
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 100
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: wandb
  wandb_project: specforge-kan-ablation
  wandb_name: qwen3.6-27b-spread5-moe-20260825
  wandb_dir: outputs/kan-ablate-qwen-spread5-moe/wandb

runtime:
  # Both watermarks must cover the global optimizer-step quantum
  # (2 ranks x batch 1 x 64 accumulation = 128 refs); kept larger so the
  # producer can run ahead a few quanta.
  in_flight_high_watermark: 640
  in_flight_low_watermark: 512

run_id: kan-ablate-qwen-spread5-moe
output_dir: outputs/kan-ablate-qwen-spread5-moe

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/kan-ablate-qwen-spread5-moe/control
    consumer_state_dir: outputs/kan-ablate-qwen-spread5-moe/consumer-state
    backend: mooncake
    store_id: kan-ablate-qwen-spread5-moe
    managed_local:
      trainer_cuda_visible_devices:
        - "4"
        - "5"
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        rpc_port: 35551
        metadata_port: 35880
        metrics_port: 35903
        # The managed-local 500ms default expires read leases mid-transfer
        # under fetch contention (lease_expired_before_data_transfer_completed
        # -707 storms; killed this run's consumer after 4 attempts). 5s stays
        # well inside the ~19.5s teardown drain.
        default_kv_lease_ttl_ms: 5000
        # 640 in-flight refs x ~0.06-0.24 GiB of BF16 features per 4K-max
        # sample (six aux/last layers at width 5120) needs more than 64 GiB.
        global_segment_size_bytes: 103079215104
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 30002
          cuda_visible_devices:
            - "1"
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 30004
          cuda_visible_devices:
            - "2"
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 30006
          cuda_visible_devices:
            - "3"
          tp_size: 1
          mem_fraction_static: 0.7
