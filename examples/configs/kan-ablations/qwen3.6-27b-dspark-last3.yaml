# Kan's hidden-state ablation: Qwen3.6-27B target, the last 3 aux layers
# ([60, 61, 62] of 64: the last three CAPTURABLE layers — SGLang captures
# layer i as the input of layer i+1, so the final layer id 63 cannot be
# captured for this architecture). Pair of qwen3.6-27b-dspark-spread5.yaml
# — identical except the draft JSON's dflash_config.target_layer_ids. Both
# runs share one node (10.13.114.102): this one owns GPUs 4-7 (2x capture +
# 2 trainer ranks) and ports 31000/31002/36551/36880/36903; the spread5 run
# owns GPUs 0-3 and ports 30000/30002/35551/35880/35903.
# Weights load from /cluster-storage (virtiofs): launch with
# SPECFORGE_SERIAL_SERVICE_STARTUP=1 and stagger the two runs so shard opens
# never overlap (concurrent opens can deadlock in fuse_open).
model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config: examples/configs/kan-ablations/qwen3.6-27b-dspark-last3.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 248070
  # Qwen3.6 is a hybrid GDN model; on Blackwell SGLang only allows
  # fa4/triton/trtllm_mha attention backends; fa4 rejects head_dim=256 on SM100.
  sglang_attention_backend: triton

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64

training:
  strategy: dspark
  num_epochs: 1
  # Two consumer ranks x one sequence x 64 microbatches -> a global batch of
  # 128, matching the DSv4 pair so all four ablation runs share the same
  # optimizer-step count (~940 over one ShareGPT epoch).
  batch_size: 1
  accumulation_steps: 64
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 100
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: wandb
  wandb_project: specforge-kan-ablation
  wandb_name: qwen3.6-27b-last3-20260824
  wandb_dir: outputs/kan-ablate-qwen-last3/wandb

runtime:
  # Both watermarks must cover the global optimizer-step quantum
  # (2 ranks x batch 1 x 64 accumulation = 128 refs); kept larger so the
  # producer can run ahead a few quanta.
  in_flight_high_watermark: 640
  in_flight_low_watermark: 512

run_id: kan-ablate-qwen-last3
output_dir: outputs/kan-ablate-qwen-last3

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: outputs/kan-ablate-qwen-last3/control
    consumer_state_dir: outputs/kan-ablate-qwen-last3/consumer-state
    backend: mooncake
    store_id: kan-ablate-qwen-last3
    managed_local:
      trainer_cuda_visible_devices:
        - "6"
        - "7"
      mooncake:
        protocol: tcp
        rpc_port: 36551
        metadata_port: 36880
        metrics_port: 36903
        # The managed-local 500ms default expires read leases mid-transfer
        # under fetch contention (lease_expired_before_data_transfer_completed
        # -707 storms; killed the spread5 consumer after 4 attempts). 5s stays
        # well inside the ~19.5s teardown drain.
        default_kv_lease_ttl_ms: 5000
        # 640 in-flight refs x ~0.04-0.16 GiB of BF16 features per 4K-max
        # sample (four aux/last layers at width 5120); sized to match the
        # spread5 pair config.
        global_segment_size_bytes: 103079215104
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 31000
          cuda_visible_devices:
            - "4"
          tp_size: 1
          mem_fraction_static: 0.7
        - port: 31002
          cuda_visible_devices:
            - "5"
          tp_size: 1
          mem_fraction_static: 0.7
