# Kan's architecture ablation: DeepSeek-V4-Flash target, the OFFICIAL
# DSparkV4 drafter (3 MoE+mHC stages, 256 experts, kv fake quant) trained FROM
# SCRATCH on ShareGPT, aligned to the other ablation arms: spread5 capture
# layers [1, 11, 21, 31, 41], block_size 7, global batch 128, same hparams.
# Pair of deepseek-v4-flash-dspark-spread5{,-moe}.yaml. TWO-NODE stack like the
# MoE arm: 10.13.114.105 = mooncake + 4x TP2 capture servers (aux 1 11 21 31
# 41), 10.13.114.103 = 8-rank FSDP trainer (MC_TRANSFER_TIMEOUT=300,
# SPECFORGE_MOONCAKE_FETCH_CLIENTS=4).
model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  draft_model_config: examples/configs/kan-ablations/deepseek-v4-flash-dspark-official-spread5.json
  target_backend: sglang
  trust_remote_code: true
  # DeepSeek-V4 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.85
  # data.max_length plus headroom: capture rejects inputs at exactly the
  # context length.
  sglang_context_length: 8704
  sglang_max_running_requests: 8
  # The checkpoint's routed experts are fp4 (`expert_dtype: "fp4"`); the
  # default MoE path cannot run them on B200.
  sglang_moe_runner_backend: flashinfer_mxfp4

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 8192
  chat_template: deepseek-v4
  cache_dir: cache
  build_dataset_num_proc: 64
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 1
  # Eight consumer ranks x one sequence x 16 microbatches -> a global batch
  # of 128, the same optimizer quantum as the dense arm.
  batch_size: 1
  accumulation_steps: 16
  # lr 6e-4 / clip 1.0 / no warmup NaN'd this from-scratch pair at steps
  # 70 (spread5) and 210 (last3) with the same grad-norm ramp the official
  # r1 run showed before its step-1210 NaN; r2's stabilized hparams
  # (half LR, tighter clip) plus a short warmup hold both variants stable.
  learning_rate: 0.0003
  lr_scheduler: constant
  warmup_ratio: 0.02
  max_grad_norm: 0.5
  # DSparkV4DraftModel implements the official window/block attention
  # itself; the wrapper builds no masks.
  attention_backend: native
  # ~20B drafter: shard params+grads+optimizer state across the 8 ranks;
  # no_sync accumulation would hold UNSHARDED grads per rank.
  fsdp_sharding: FULL_SHARD
  fsdp_no_sync_grad_accum: false
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  # ~20B drafter: each checkpoint is ~250 GB (weights + sharded optimizer
  # state); save every 256 steps (3 saves + final) to keep /personal in budget.
  save_interval: 256
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge-kan-ablation
  wandb_name: deepseek-v4-flash-official-spread5-20260826
  wandb_dir: outputs/kan-ablate-dsv4-official-spread5/wandb

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # One 8K sample is ~0.4 GiB of BF16 DSpark features (five aux layers plus
  # the pre-head hidden state at width 4096). Watermarks kept identical across
  # both ablation variants (conservative for the 3-layer one).
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 137438953472
  resident_low_watermark_bytes: 103079215104
  feature_store_max_resident_bytes: 171798691840

run_id: kan-ablate-dsv4-official-spread5
output_dir: outputs/kan-ablate-dsv4-official-spread5

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/kan-ablate-dsv4-official-spread5/control
    consumer_state_dir: outputs/kan-ablate-dsv4-official-spread5/consumer-state
    backend: mooncake
    store_id: kan-ablate-dsv4-official-spread5
    server_urls:
      - http://10.13.114.105:30000
      - http://10.13.114.105:30001
      - http://10.13.114.105:30002
      - http://10.13.114.105:30003
    mooncake_metadata_server: http://10.13.114.105:35880/metadata
    mooncake_master_server_addr: 10.13.114.105:35551
    mooncake_local_hostname: 10.13.114.103
    # Measured on this B200 pair: single TCP stream 3.3 GB/s, 4 fetch
    # clients 11.4 GB/s aggregate.
    mooncake_protocol: tcp
    # An 8K spread5 sample is ~0.4 GiB transferred as one object; the client
    # buffer must hold it with headroom.
    client_buffer_size: 2147483648
