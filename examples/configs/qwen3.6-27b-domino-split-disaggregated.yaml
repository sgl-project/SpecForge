# External-service variant: start Mooncake and the SGLang capture server first,
# then launch the producer and consumer roles separately with this same config.
model:
  target_model_path: /disk3/wjp/pretrained_models/Qwen3.6-27B
  draft_model_config: configs/qwen3.6-27b-domino-full-attention.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 248070
data:
  train_data_path: "/disk3/wjp/datasets/perfectblend/qwen3.6-27b/data/sharegpt/full.jsonl"
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 32
training:
  strategy: domino
  num_epochs: 6
  # One consumer rank x eight microbatches preserves the existing Domino
  # recipe's effective global batch of eight sequences.
  batch_size: 1
  accumulation_steps: 8
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 256
  loss_decay_gamma: 7
  lambda_base_start: 1
  lambda_base_decay_ratio: 1
  save_interval: 2000
  log_interval: 10
  dist_timeout: 30
  seed: 42
run_id: qwen3.6-27b-domino-split-disaggregated-08071100-wo-profile
output_dir: outputs/qwen3.6-27b-domino-split-disaggregated-08071100-wo-profile

profiling:
  enabled: false
  start_step: 0
  num_steps: 20
  record_shapes: false

# 1721更新
runtime:
    producer_lease: 64
    producer_concurrency: 32
    in_flight_high_watermark: 1024
    in_flight_low_watermark: 512


deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3.6-27b-domino-split-disaggregated-08071100-wo-profile/control
    consumer_state_dir: outputs/qwen3.6-27b-domino-split-disaggregated-08071100-wo-profile/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
