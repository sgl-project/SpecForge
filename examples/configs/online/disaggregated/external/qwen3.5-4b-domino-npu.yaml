model:
  target_model_path: "Qwen/Qwen3.5-4B"
  draft_model_config:
    architectures: [DominoDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: domino.DominoDraftModel
    block_size: 16
    bos_token_id: 248043
    dflash_config:
      mask_token_id: 248070
      target_layer_ids: [3, 11, 19, 27, 31]
      projector_type: domino
      pure_draft_prefix_len: 1
      emb_dim: 256
      gru_hidden_dim: 1024
      shift_label: true
    dtype: bfloat16
    eos_token_id: 248044
    head_dim: 128
    hidden_act: silu
    hidden_size: 2560
    initializer_range: 0.02
    intermediate_size: 9216
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 262144
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 32
    pad_token_id: 248044
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 10000000
    sliding_window: null
    tie_word_embeddings: true
    use_cache: true
    use_sliding_window: false
    vocab_size: 248320
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/train_regen.jsonl"
  max_length: 1024
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "domino"
  num_epochs: 10
  batch_size: 1
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "sdpa"
  num_anchors: 16
  loss_decay_gamma: 7
  lambda_base_start: 1
  lambda_base_decay_ratio: 1
  save_interval: 3000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-4b-domino-npu-online"
output_dir: "./outputs/qwen3.5-4b-domino-npu-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3.5-4b-domino-npu-online/control
    consumer_state_dir: outputs/qwen3.5-4b-domino-npu-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
