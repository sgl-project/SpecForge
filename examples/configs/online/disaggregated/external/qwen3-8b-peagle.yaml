model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    schema_version: 1
    hidden_size: 4096
    num_hidden_layers: 4
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 151936
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - PEagleDraftModel
    model_type: llama
    rope_scaling: null
    rope_theta: 1000000
    torch_dtype: bfloat16
    transformers_version: 4.51.0
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 17
      - 32
    mask_token_id: 151669
    norm_before_residual: false
    layers:
      attention:
        type: gqa
        is_causal: true
  target_backend: sglang
  vocab_mapping_path: cache/vocab_mapping/qwen3-8b.pt
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 4096
  chat_template: qwen
  build_dataset_num_proc: 32
  cache_dir: cache

training:
  strategy: peagle
  num_epochs: 20
  max_steps: 10000
  batch_size: 1
  learning_rate: 1.0e-4
  warmup_ratio: 0.0025
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_depths: 5
  down_sample_ratio: 0.8
  down_sample_ratio_min: 0.2
  save_interval: 50000
  log_interval: 50
  dist_timeout: 120
  seed: 0

tracking:
  report_to: wandb

run_id: qwen3-8b-peagle-disaggregated
output_dir: outputs/qwen3-8b-peagle-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3-8b-peagle-disaggregated/control
    consumer_state_dir: outputs/qwen3-8b-peagle-disaggregated/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
