model:
  target_model_path: "Qwen/Qwen3.5-4B"
  draft_model_config:
    schema_version: 1
    hidden_size: 2560
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 248044
    bos_token_id: 248043
    eos_token_id: 248044
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 248320
    intermediate_size: 9728
    max_position_embeddings: 262144
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - DFlashDraftModel
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 248070
      target_layer_ids:
      - 1
      - 8
      - 15
      - 22
      - 29
      projector_type: null
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 32
    rope_scaling: null
    rope_theta: 10000000
    transformers_version: 4.57.1
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/train_regen.jsonl"
  max_length: 3072
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "sdpa"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-4b-dflash-npu-online"
output_dir: "./outputs/qwen3.5-4b-dflash-npu-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3.5-4b-dflash-npu-online/control
    consumer_state_dir: outputs/qwen3.5-4b-dflash-npu-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
