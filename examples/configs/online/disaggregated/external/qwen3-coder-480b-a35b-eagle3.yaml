model:
  target_model_path: "Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    head_dim: 128
    hidden_act: silu
    hidden_size: 6144
    initializer_range: 0.02
    intermediate_size: 16384
    max_position_embeddings: 262144
    max_window_layers: 62
    model_type: llama
    num_attention_heads: 96
    num_hidden_layers: 1
    num_key_value_heads: 8
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: null
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.51.0
    use_cache: true
    use_sliding_window: false
    vocab_size: 151936
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 30, 58]
  vocab_mapping_path: cache/vocab_mapping/qwen3-coder-480b-a35b-eagle3.pt
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  sglang_mem_fraction_static: 0.6
  sglang_ep_size: 1
data:
  train_data_path: "./cache/dataset/opc_regenerated.jsonl"
  max_length: 2048
  chat_template: "qwen"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.00001
  max_grad_norm: 0.5
  ttt_length: 13
  attention_backend: "flex_attention"
  tp_size: 1
  save_interval: 20000
  log_interval: 50
  dist_timeout: 20
  seed: 0
tracking:
  report_to: "wandb"
  wandb_project: "specforge-qwen3-480-coder-fp8"
  wandb_name: "qwen3-coder-480b-a35b-eagle3-tp8-ep2-opc-regen"
run_id: "qwen3-coder-480b-a35b-eagle3-online"
output_dir: "./outputs/qwen3-coder-480b-a35b-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3-coder-480b-a35b-eagle3-online/control
    consumer_state_dir: outputs/qwen3-coder-480b-a35b-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
