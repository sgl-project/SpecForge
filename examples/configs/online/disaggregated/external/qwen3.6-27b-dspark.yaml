model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config:
    schema_version: 1
    hidden_size: 5120
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 248044
    bos_token_id: null
    eos_token_id: 248044
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 248320
    intermediate_size: 17408
    max_position_embeddings: 262144
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - DSparkDraftModel
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    dflash_config:
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 248070
      projector_type: dspark
      target_layer_ids:
      - 2
      - 17
      - 32
      - 47
      - 62
      pure_draft_prefix_len: 0
      shift_label: false
    block_size: 16
    target_hidden_size: null
    model_type: qwen3
    rope_theta: 10000000
    rope_scaling: null
    num_target_layers: 64
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"

data:
  train_data_path: "./cache/dataset/nemotron_v2_train.jsonl"
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64

training:
  strategy: dspark
  num_epochs: 10
  # One trainer rank with 512 microbatches preserves global batch size 512.
  batch_size: 1
  accumulation_steps: 512
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 125
  dist_timeout: 30
  seed: 42

run_id: qwen3.6-27b-dspark-online
output_dir: outputs/qwen3.6-27b-dspark-online

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3.6-27b-dspark-online/control
    consumer_state_dir: outputs/qwen3.6-27b-dspark-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
