model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  target_backend: sglang
  trust_remote_code: true
  embedding_key: embed.weight
  lm_head_key: head.weight
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.85
  sglang_context_length: 8704
  sglang_max_running_requests: 8
  sglang_moe_runner_backend: flashinfer_mxfp4
data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 8192
  chat_template: deepseek-v4
  cache_dir: cache
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  loss:
    fused: true
    scheduling:
      chunk_size: 128
    terms:
      token:
        options:
          ce_weight: 0.1
          l1_weight: 0.9
      confidence:
        coefficient: 1.0
  weighting:
    kind: exponential
    gamma: 4.0
  num_epochs: 2
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  attention_backend: flex_attention
  save_interval: 128
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1
  objective_options:
    num_anchors: 512
tracking:
  report_to: wandb
  wandb_project: specforge
  wandb_name: deepseek-v4-flash-dspark-specforge-disaggregated
  wandb_dir: outputs/deepseek-v4-flash-dspark-disaggregated/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 8
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 137438953472
  resident_low_watermark_bytes: 103079215104
  feature_store_max_resident_bytes: 171798691840
run_id: deepseek-v4-flash-dspark-disaggregated
output_dir: outputs/deepseek-v4-flash-dspark-disaggregated
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/deepseek-v4-flash-dspark-disaggregated/control
    consumer_state_dir: outputs/deepseek-v4-flash-dspark-disaggregated/consumer-state
    backend: mooncake
    store_id: deepseek-v4-flash-dspark-specforge-disaggregated
    server_urls:
    - http://127.0.0.1:30000
    - http://127.0.0.1:30001
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
draft: specforge/config/draft/presets/deepseek-v4-flash-dspark.yaml
