model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  draft_model_config:
    schema_version: 1
    hidden_size: 4096
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 1
    bos_token_id: 0
    eos_token_id: 1
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 129280
    intermediate_size: 12288
    max_position_embeddings: 1048576
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - DSparkDraftModel
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    block_size: 7
    dflash_config:
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 128799
      projector_type: dspark
      target_layer_ids:
      - 1
      - 11
      - 21
      - 31
      - 41
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 43
    rope_parameters:
      factor: 16.0
      original_max_position_embeddings: 65536
      rope_theta: 10000.0
      rope_type: yarn
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  trust_remote_code: true
  # DeepSeek-V4 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.85
  # data.max_length plus headroom: capture rejects inputs at exactly context length.
  sglang_context_length: 8704
  sglang_max_running_requests: 8
  # Routed experts are fp4; the default MoE path cannot run them on B200.
  sglang_moe_runner_backend: flashinfer_mxfp4

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 8192
  chat_template: deepseek-v4
  cache_dir: cache
  build_dataset_num_proc: 64
  # Async prefetch: overlaps per-sample Mooncake feature fetches with compute.
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 2
  # 4 ranks x 32 microbatches -> global batch 128.
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 128
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge
  wandb_name: deepseek-v4-flash-dspark-specforge-disaggregated
  wandb_dir: outputs/deepseek-v4-flash-dspark-disaggregated/wandb

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Keep two 128-sample optimizer quanta in flight (~0.4 GiB features/sample);
  # the low watermark is one full quantum so complete windows always dispatch.
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 137438953472
  resident_low_watermark_bytes: 103079215104
  feature_store_max_resident_bytes: 171798691840

run_id: deepseek-v4-flash-dspark-disaggregated
output_dir: outputs/deepseek-v4-flash-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/deepseek-v4-flash-dspark-disaggregated/control
    consumer_state_dir: outputs/deepseek-v4-flash-dspark-disaggregated/consumer-state
    backend: mooncake
    store_id: deepseek-v4-flash-dspark-specforge-disaggregated
    # Two TP2 servers out-produce one TP4 server (TP prefill scaling is sublinear).
    server_urls:
      - http://127.0.0.1:30000
      - http://127.0.0.1:30001
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
