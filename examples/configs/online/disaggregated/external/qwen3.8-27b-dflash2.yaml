model:
  target_model_path: Qwen/Qwen3.8-27B
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  sglang_attention_backend: triton
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
data:
  train_data_path: ./cache/dataset/qwen3.8-27b-regen-train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: cache/qwen3.8-27b-dflash2
training:
  loss:
    fused: true
    scheduling:
      chunk_size: 128
      checkpoint: false
    terms:
      selector:
        coefficient: 1.0
  weighting:
    kind: exponential
    gamma: 7.0
  num_epochs: 1
  tp_size: 1
  batch_size: 2
  accumulation_steps: 4
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  attention_backend: flex_attention
  save_interval: 500
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42
  objective_options:
    num_anchors: 512
    selector_stop_gradient: false
tracking:
  report_to: none
runtime:
  producer_lease: 4
  producer_concurrency: 4
  in_flight_high_watermark: 512
  in_flight_low_watermark: 256
run_id: qwen3.8-27b-dflash2-disaggregated
output_dir: outputs/qwen3.8-27b-dflash2-disaggregated
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dflash2-disaggregated/control
    consumer_state_dir: outputs/qwen3.8-27b-dflash2-disaggregated/consumer-state
    backend: mooncake
    server_urls:
    - http://capture-node:30000
    - http://capture-node:30001
    - http://capture-node:30002
    - http://capture-node:30003
    - http://capture-node:30004
    - http://capture-node:30005
    - http://capture-node:30006
    - http://capture-node:30007
    mooncake_metadata_server: http://capture-node:35880/metadata
    mooncake_master_server_addr: capture-node:35551
    mooncake_protocol: tcp
    client_buffer_size: 2147483648
draft: specforge/config/draft/presets/qwen3.8-27b-dflash2.yaml
