# Qwen3.8-27B DFlash2 across two 8-GPU nodes with externally managed services:
# eight TP=1 patched SGLang capture servers and the Mooncake master on the
# capture node, a DP=8 DFlash2 trainer on the trainer node.
#
# examples/disagg/run_qwen3.8_27b_dflash2_disagg_2node.sh starts the services
# and both SpecForge roles from this file and overrides the endpoints below
# with the capture node's address.  Flow control and Mooncake settings are
# the ones measured in docs/recipes/qwen3.8-27b-dflash2-disaggregated.md on
# 2x8 B300 and 2x8 H200; the same document covers the RDMA transport and the
# 10 servers + DP6 split.
model:
  target_model_path: Qwen/Qwen3.8-27B
  draft_model_config:
    architectures: [DFlash2DraftModel]
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: null
    is_causal: false
    dflash_config:
      block_size: 8
      conv_group_size: 16
      conv_kernel_size: 2
      mask_token_id: 248070
      selector_rank: 256
      selector_top_k: 16
      target_layer_ids: [5, 19, 33, 47, 61]
    dtype: bfloat16
    eos_token_id: 248044
    head_dim: 128
    hidden_act: silu
    hidden_size: 5120
    initializer_range: 0.02
    intermediate_size: 17408
    layer_types: [sliding_attention, sliding_attention, sliding_attention, sliding_attention, sliding_attention]
    max_position_embeddings: 262144
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 64
    pad_token_id: 248044
    rms_norm_eps: 1.0e-06
    rope_parameters:
      rope_theta: 10000000
      rope_type: default
    sliding_window: 2048
    tie_word_embeddings: false
    transformers_version: 5.12.1
    use_cache: true
    use_sliding_window: true
    vocab_size: 248320
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  sglang_attention_backend: triton
  sglang_disable_radix_cache: true
  sglang_context_length: 8199

data:
  train_data_path: ./cache/dataset/qwen3.8-27b-regen-train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: cache/qwen3.8-27b-dflash2

training:
  strategy: dflash
  num_epochs: 1
  tp_size: 1
  # 8 ranks x 2 x 4 = 64 samples per optimizer step.
  batch_size: 2
  accumulation_steps: 4
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  # Measured without objective checkpointing: keep each chunk's logits for
  # backward instead of recomputing the 248k-vocabulary projection.
  objective_checkpointing: false
  loss_type: dflash
  dflash2_selector_loss_alpha: 1.0
  dflash2_selector_stop_gradient: false
  save_interval: 500
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42

tracking:
  report_to: none

runtime:
  producer_lease: 4
  producer_concurrency: 4
  # 8x the 64-sample step quantum: 8 ranks x 8 prefetch workers x 2 samples
  # of leased refs plus one acknowledged window.  192/96 throttled this
  # topology to 14 samples/s where 512/256 reached 18.
  in_flight_high_watermark: 512
  in_flight_low_watermark: 256

run_id: qwen3.8-27b-dflash2-disaggregated
output_dir: outputs/qwen3.8-27b-dflash2-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dflash2-disaggregated/control
    consumer_state_dir: outputs/qwen3.8-27b-dflash2-disaggregated/consumer-state
    backend: mooncake
    server_urls:
      - http://capture-node:30000
      - http://capture-node:30001
      - http://capture-node:30002
      - http://capture-node:30003
      - http://capture-node:30004
      - http://capture-node:30005
      - http://capture-node:30006
      - http://capture-node:30007
    mooncake_metadata_server: http://capture-node:35880/metadata
    mooncake_master_server_addr: capture-node:35551
    # `rdma` with `mooncake_rdma_devices` (for example `mlx5_0`) matched TCP
    # throughput on 2x8 H200; the servers, not the transport, were the limit.
    mooncake_protocol: tcp
    client_buffer_size: 2147483648
