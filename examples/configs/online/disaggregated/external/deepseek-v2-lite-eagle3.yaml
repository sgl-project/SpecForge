model:
  target_model_path: "deepseek-ai/DeepSeek-V2-Lite"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 100000
    eos_token_id: 100001
    head_dim: 128
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 10944
    max_position_embeddings: 163840
    max_window_layers: 64
    model_type: llama
    num_attention_heads: 16
    num_hidden_layers: 1
    num_key_value_heads: 16
    rms_norm_eps: 1.0e-06
    rope_scaling:
      beta_fast: 32.0
      beta_slow: 1.0
      factor: 40.0
      mscale: 0.707
      mscale_all_dim: 0.707
      original_max_position_embeddings: 4096
      rope_type: yarn
    rope_theta: 10000
    sliding_window: null
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.33.1
    use_cache: true
    use_sliding_window: false
    vocab_size: 102400
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 12, 23]
  vocab_mapping_path: cache/vocab_mapping/deepseek-v2-lite-eagle3.pt
  target_backend: sglang
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 4096
  chat_template: "deepseek-v2"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "deepseek-v2-lite-eagle3-online"
output_dir: "./outputs/deepseek-v2-lite-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/deepseek-v2-lite-eagle3-online/control
    consumer_state_dir: outputs/deepseek-v2-lite-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
