model:
  target_model_path: thinkingmachines/Inkling
  draft_model_config:
    architectures: [DSparkDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    block_size: 7
    bos_token_id: null
    dflash_config:
      attention_mode: gqa
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 200064
      projector_type: dspark
      target_layer_ids: [5, 17, 35, 47, 59]
    dtype: bfloat16
    eos_token_id: 200006
    head_dim: 64
    hidden_act: silu
    hidden_size: 6144
    initializer_range: 0.02
    intermediate_size: 12288
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 1048576
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 64
    num_hidden_layers: 5
    num_key_value_heads: 16
    num_target_layers: 66
    pad_token_id: 200006
    rms_norm_eps: 1.0e-05
    rope_scaling: null
    rope_theta: 8000000
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 201024
  target_backend: sglang
  trust_remote_code: true
  tokenizer_pad_token_id: 200006
  embedding_key: model.llm.embed.weight
  lm_head_key: model.llm.unembed.weight
  # Inkling's hybrid cache path requires the unified radix tree. These values
  # match the SGLang #31847 configuration validated by the two-node launcher.
  sglang_attention_backend: fa4
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: false
  sglang_context_length: 4103
  sglang_moe_runner_backend: flashinfer_trtllm_routed
  sglang_page_size: 128
  sglang_quantization: modelopt_fp4
  sglang_mamba_radix_cache_strategy: extra_buffer
  sglang_max_mamba_cache_size: 64
  sglang_swa_full_tokens_ratio: 0.2
data:
  train_data_path: ./cache/dataset/inkling_dspark_train.jsonl
  max_length: 4096
  chat_template: inkling-thinking
  cache_dir: cache
  build_dataset_num_proc: 64
training:
  strategy: dspark
  num_epochs: 10
  # Portable one-rank equivalent of the source recipe's global batch 512.
  batch_size: 1
  accumulation_steps: 512
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: eager
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  # Optimizer-step equivalent of about 250 source microsteps at microbatch 16.
  save_interval: 8
  dist_timeout: 30
  seed: 42
run_id: inkling-dspark-disaggregated
output_dir: outputs/inkling-dspark-disaggregated
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/inkling-dspark-disaggregated/control
    backend: mooncake
    server_urls: [http://127.0.0.1:30000]
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
