model:
  target_model_path: deepseek-ai/DeepSeek-V4.1-Flash
  # DeepSeek-V4.1's own DSpark draft: V4.1 attention, single-pass mHC, 128-expert MoE.
  draft_model_config: configs/deepseek-v4.1-flash-moe-dspark.json
  # Weights-only warm start from the official mtp.* draft
  # (scripts/convert_deepseek_v41_dspark.py); drop it to train from scratch.
  draft_checkpoint_path: outputs/deepseek-v4.1-flash-dspark-draft
  target_backend: sglang
  trust_remote_code: true
  # DeepSeek-V4.1 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  # 510 GB of weights on four 178 GB B200s: 0.80 keeps the fp4 MoE kernels' workspace
  # for a 16k-token prefill (0.85 runs out of memory there).
  sglang_mem_fraction_static: 0.80
  # data.max_length plus headroom: capture rejects inputs at exactly context length.
  sglang_context_length: 16896
  sglang_max_running_requests: 4
  # Expert parallel keeps the 2304-wide experts whole; TP alone would split them into
  # 288 columns, which the fp4 MoE kernels reject.
  sglang_ep_size: 4

data:
  train_data_path: ./cache/dataset/deepseek-v4.1-flash-thinking-regen.jsonl
  max_length: 16384
  # Thinking-mode rows regenerated by the target: reasoning_content renders in <think>.
  chat_template: deepseek-v4.1-thinking
  cache_dir: cache
  build_dataset_num_proc: 32
  # Async prefetch: overlaps per-sample Mooncake feature fetches with compute.
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 1
  # 2 ranks x 64 microbatches -> global batch 128.
  batch_size: 1
  accumulation_steps: 64
  # 14.2B draft parameters on two GPUs: shard parameters, gradients and optimizer state.
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  # Fine-tuning the official draft on the target's own outputs.
  learning_rate: 0.00002
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  # The V4.1 draft's attention sinks need flex_attention (eager is the CPU reference).
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 128
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge
  wandb_name: deepseek-v4.1-flash-moe-dspark-specforge-disaggregated
  wandb_dir: outputs/deepseek-v4.1-flash-moe-dspark-disaggregated/wandb

runtime:
  producer_lease: 8
  producer_concurrency: 8
  # Keep two 128-sample optimizer quanta in flight; the low watermark is one full
  # quantum so complete windows always dispatch.
  in_flight_high_watermark: 256
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 137438953472
  resident_low_watermark_bytes: 103079215104
  feature_store_max_resident_bytes: 171798691840

run_id: deepseek-v4.1-flash-moe-dspark-disaggregated
output_dir: outputs/deepseek-v4.1-flash-moe-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: outputs/deepseek-v4.1-flash-moe-dspark-disaggregated/control
    consumer_state_dir: outputs/deepseek-v4.1-flash-moe-dspark-disaggregated/consumer-state
    backend: mooncake
    store_id: deepseek-v4.1-flash-moe-dspark-specforge-disaggregated
    # The capture plugin on SGLang's native extension points; no source patch.
    server_capture: plugin
    # One TP4/EP4 capture server on GPUs 0-3; the trainer takes GPUs 4-5.
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
