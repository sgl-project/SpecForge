model:
  target_model_path: "Qwen/Qwen3.5-35B-A3B"
  draft_model_config:
    architectures: [DFlashDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    bos_token_id: 151643
    dflash_config:
      mask_token_id: 248070
      target_layer_ids: [1, 10, 19, 28, 37]
    dtype: bfloat16
    eos_token_id: 248046
    head_dim: 128
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 6144
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention, full_attention,
      full_attention, full_attention]
    max_position_embeddings: 262144
    max_window_layers: 8
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 8
    num_key_value_heads: 4
    num_target_layers: 40
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 10000000
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 248320
  target_backend: "sglang"
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  sglang_mem_fraction_static: 0.5
data:
  train_data_path: "./cache/dataset/opc_train_regen_first_turn.jsonl"
  max_length: 4096
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "tensorboard"
run_id: "qwen3.5-35b-a3b-dflash-online"
output_dir: "./outputs/qwen3.5-35b-a3b-dflash-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3.5-35b-a3b-dflash-online/control
    consumer_state_dir: outputs/qwen3.5-35b-a3b-dflash-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
