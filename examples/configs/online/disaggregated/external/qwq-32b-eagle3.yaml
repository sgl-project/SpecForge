model:
  target_model_path: "Qwen/QwQ-32B"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    hidden_act: silu
    hidden_size: 5120
    initializer_range: 0.02
    intermediate_size: 27648
    max_position_embeddings: 40960
    max_window_layers: 64
    model_type: qwen2
    num_attention_heads: 40
    num_hidden_layers: 1
    num_key_value_heads: 8
    rms_norm_eps: 1.0e-05
    rope_theta: 1000000.0
    sliding_window: 32768
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.43.1
    use_cache: true
    use_sliding_window: false
    vocab_size: 152064
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 31, 60]
  vocab_mapping_path: cache/vocab_mapping/qwq-32b-eagle3.pt
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 4096
  chat_template: "qwen"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  tp_size: 1
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "qwq-32b-eagle3-online"
output_dir: "./outputs/qwq-32b-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwq-32b-eagle3-online/control
    consumer_state_dir: outputs/qwq-32b-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
