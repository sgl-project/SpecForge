model:
  target_model_path: "meta-llama/Llama-3.3-70B-Instruct"
  draft_model_config:
    schema_version: 1
    hidden_size: 8192
    num_hidden_layers: 1
    num_attention_heads: 64
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-05
    pad_token_id: 0
    bos_token_id: 128000
    eos_token_id:
    - 128001
    - 128008
    - 128009
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 128256
    intermediate_size: 28672
    max_position_embeddings: 4096
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - LlamaForCausalLMEagle3
    model_type: llama
    rope_scaling:
      factor: 8.0
      high_freq_factor: 4.0
      low_freq_factor: 1.0
      original_max_position_embeddings: 4096
      rope_type: llama3
    rope_theta: 500000.0
    torch_dtype: float16
    transformers_version: 4.28.1
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 39
      - 76
    layers:
      attention:
        type: gqa
        is_causal: true
  vocab_mapping_path: cache/vocab_mapping/llama3.3-70b-eagle3.pt
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt.jsonl"
  max_length: 4096
  chat_template: "llama3"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  tp_size: 1
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "llama3.3-70b-eagle3-online"
output_dir: "./outputs/llama3.3-70b-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/llama3.3-70b-eagle3-online/control
    consumer_state_dir: outputs/llama3.3-70b-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
