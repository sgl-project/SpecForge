model:
  target_model_path: "Qwen/Qwen2.5-0.5B-Instruct"
  draft_model_config:
    architectures: [DFlashDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    bos_token_id: 151643
    dflash_config:
      mask_token_id: 151669
      target_layer_ids: [1, 6, 11, 16, 21]
    dtype: bfloat16
    eos_token_id: 151645
    head_dim: 64
    hidden_act: silu
    hidden_size: 896
    initializer_range: 0.02
    intermediate_size: 4864
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 32768
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 14
    num_hidden_layers: 5
    num_key_value_heads: 2
    num_target_layers: 24
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 151936
  target_backend: sglang
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 512
  chat_template: "qwen"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42
run_id: "qwen2.5-0.5b-dflash-online"
output_dir: "./outputs/qwen2.5-0.5b-dflash-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen2.5-0.5b-dflash-online/control
    consumer_state_dir: outputs/qwen2.5-0.5b-dflash-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
