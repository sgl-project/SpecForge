model:
  target_model_path: "Qwen/Qwen2.5-0.5B-Instruct"
  draft_model_config:
    schema_version: 1
    hidden_size: 896
    num_hidden_layers: 5
    num_attention_heads: 14
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 151936
    intermediate_size: 4864
    max_position_embeddings: 32768
    num_key_value_heads: 2
    head_dim: 64
    architectures:
    - DFlashDraftModel
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 151669
      target_layer_ids:
      - 1
      - 6
      - 11
      - 16
      - 21
      projector_type: null
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 24
    rope_scaling: null
    rope_theta: 1000000
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 512
  chat_template: "qwen"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42
run_id: "qwen2.5-0.5b-dflash-online"
output_dir: "./outputs/qwen2.5-0.5b-dflash-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen2.5-0.5b-dflash-online/control
    consumer_state_dir: outputs/qwen2.5-0.5b-dflash-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
