model:
  target_model_path: moonshotai/Kimi-K3
  draft_model_config:
    schema_version: 1
    hidden_size: 7168
    num_hidden_layers: 5
    num_attention_heads: 64
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-05
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 163839
    bos_token_id: 163584
    eos_token_id: 163586
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 163840
    intermediate_size: 14336
    max_position_embeddings: 65536
    num_key_value_heads: 16
    head_dim: 64
    architectures:
    - DSparkDraftModel
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    block_size: 7
    dflash_config:
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 163824
      projector_type: dspark
      target_layer_ids:
      - 7
      - 23
      - 51
      - 67
      - 83
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 93
    rope_parameters:
      factor: 16.0
      original_max_position_embeddings: 65536
      rope_theta: 10000.0
      rope_type: yarn
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
  trust_remote_code: true
  embedding_key: language_model.model.embed_tokens.weight
  lm_head_key: language_model.lm_head.weight
  torch_dtype: bfloat16
  sglang_attention_backend: trtllm_mla
  sglang_mem_fraction_static: 0.76
  sglang_context_length: 66048
  sglang_max_running_requests: 1
  sglang_max_total_tokens: 66048
  sglang_moe_runner_backend: marlin
  sglang_mamba_radix_cache_strategy: extra_buffer
  sglang_max_mamba_cache_size: 5

data:
  train_data_path: ./cache/dataset/kimi_k3_dspark_train.jsonl
  max_length: 65536
  chat_template: kimi-k3-thinking
  cache_dir: cache
  build_dataset_num_proc: 64
  dataloader_num_workers: 0

training:
  strategy: dspark
  num_epochs: 10
  # Four consumer ranks x one sequence x 32 microbatches preserves the old
  # effective global batch of 128 sequences.
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 8
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge-dspark
  wandb_name: kimi-k3-dspark-specforge-disaggregated
  wandb_dir: outputs/kimi-k3-dspark-disaggregated/wandb

runtime:
  producer_lease: 1
  producer_concurrency: 1
  # One 64K K3 sample is roughly 5.25 GiB of BF16 DSpark features. A complete
  # optimizer quantum is 128 samples, so the server segment must exceed 672 GiB.
  in_flight_high_watermark: 128
  # Consumers dispatch complete optimizer windows. Keep the resume threshold
  # at least one global quantum to avoid a producer/consumer backpressure
  # deadlock while a window is still incomplete.
  in_flight_low_watermark: 128
  resident_high_watermark_bytes: 858993459200
  resident_low_watermark_bytes: 697932185600
  feature_store_max_resident_bytes: 966367641600

run_id: kimi-k3-dspark-disaggregated
output_dir: outputs/kimi-k3-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/kimi-k3-dspark-disaggregated/control
    consumer_state_dir: outputs/kimi-k3-dspark-disaggregated/consumer-state
    backend: mooncake
    store_id: kimi-k3-dspark-specforge-disaggregated
    server_urls:
      - http://capture-node:30000
    mooncake_metadata_server: http://capture-node:35880/metadata
    mooncake_master_server_addr: capture-node:35551
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
