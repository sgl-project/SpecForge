# Multimodal (image+text) DSpark on Qwen3.5-4B: disaggregated online training
# against an external patched SGLang capture server. Requires sglang v0.5.14
# with patches/sglang/v0.5.14/spec-capture.patch and
# SGLANG_MM_AVOID_RETOKENIZE=1 on the capture server. DSpark capture adds
# target_last_hidden_states on top of the DFlash multimodal feature set.
#
# Data: ShareGPT-style JSONL with an optional top-level "image" field (file
# path or base64) per record; text-only records are supported in the same run.
model:
  target_model_path: Qwen/Qwen3.5-4B
  draft_model_config: configs/qwen3.5-4b-dspark.json
  target_backend: sglang
  trust_remote_code: true
  input_modality: multimodal
data:
  train_data_path: ./cache/dataset/train_vl_regen.jsonl
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 32
training:
  strategy: dspark
  num_epochs: 10
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 1000
  dist_timeout: 30
  seed: 42
tracking:
  report_to: none
run_id: qwen3.5-4b-vl-dspark
output_dir: outputs/qwen3.5-4b-vl-dspark

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3.5-4b-vl-dspark/control
    consumer_state_dir: outputs/qwen3.5-4b-vl-dspark/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
