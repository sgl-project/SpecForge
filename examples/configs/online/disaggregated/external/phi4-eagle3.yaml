model:
  target_model_path: "microsoft/phi-4"
  draft_model_config:
    schema_version: 1
    hidden_size: 5120
    num_hidden_layers: 1
    num_attention_heads: 40
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-05
    attention_bias: false
    attention_dropout: 0.0
    pad_token_id: 100257
    bos_token_id: 100257
    eos_token_id: 100257
    use_cache: true
    tie_word_embeddings: false
    vocab_size: 100352
    intermediate_size: 17920
    max_position_embeddings: 16384
    num_key_value_heads: 10
    architectures:
    - LlamaForCausalLMEagle3
    model_type: llama
    rope_theta: 250000.0
    torch_dtype: bfloat16
    transformers_version: 4.47.0
    draft_vocab_size: 32000
    eagle_config:
      eagle_aux_hidden_state_layer_ids:
      - 1
      - 19
      - 36
    layers:
      attention:
        type: gqa
        is_causal: true
  vocab_mapping_path: cache/vocab_mapping/phi4-eagle3.pt
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 2048
  chat_template: "phi4"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "flex_attention"
  save_interval: 1000
  log_interval: 50
  dist_timeout: 20
  seed: 0
run_id: "phi4-eagle3-online"
output_dir: "./outputs/phi4-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/phi4-eagle3-online/control
    consumer_state_dir: outputs/phi4-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
