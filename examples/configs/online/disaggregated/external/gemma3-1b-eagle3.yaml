model:
  target_model_path: "google/gemma-3-1b-it"
  draft_model_config:
    architectures: [LlamaForCausalLMEagle3]
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 2
    eos_token_id: 1
    pad_token_id: 0
    head_dim: 256
    hidden_act: silu
    hidden_size: 1152
    initializer_range: 0.02
    intermediate_size: 6912
    max_position_embeddings: 32768
    model_type: llama
    num_attention_heads: 4
    num_hidden_layers: 1
    num_key_value_heads: 1
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: 512
    tie_word_embeddings: false
    torch_dtype: bfloat16
    transformers_version: 4.50.0
    use_cache: true
    use_sliding_window: false
    vocab_size: 262144
    draft_vocab_size: 32000
    target_model_type: gemma3_text
    eagle_config:
      eagle_aux_hidden_state_layer_ids: [1, 12, 22]
  vocab_mapping_path: cache/vocab_mapping/gemma3-1b-eagle3.pt
  target_backend: sglang
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/sharegpt_train.jsonl"
  max_length: 4096
  chat_template: "gemma"
  build_dataset_num_proc: 64
  cache_dir: "./cache"
training:
  strategy: "eagle3"
  num_epochs: 10
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0001
  max_grad_norm: 0.5
  ttt_length: 7
  attention_backend: "sdpa"
  save_interval: 1000
  log_interval: 10
  dist_timeout: 20
  seed: 0
run_id: "gemma3-1b-eagle3-online"
output_dir: "./outputs/gemma3-1b-eagle3-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/gemma3-1b-eagle3-online/control
    consumer_state_dir: outputs/gemma3-1b-eagle3-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
