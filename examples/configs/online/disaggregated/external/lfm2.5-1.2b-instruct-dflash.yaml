model:
  target_model_path: "LiquidAI/LFM2.5-1.2B-Instruct"
  draft_model_config:
    schema_version: 1
    hidden_size: 2048
    num_hidden_layers: 8
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-05
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 1
    eos_token_id: 7
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 65536
    intermediate_size: 6144
    max_position_embeddings: 128000
    num_key_value_heads: 8
    head_dim: 64
    architectures:
    - DFlashDraftModel
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 16
      target_layer_ids:
      - 1
      - 4
      - 7
      - 10
      - 13
      projector_type: null
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 16
    rope_theta: 1000000.0
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: "sglang"
  embedding_key: "model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/perfectblend_lfm2.5-1.2b_regen.jsonl"
  max_length: 4096
  chat_template: "lfm"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 6
  max_steps: 10000
  batch_size: 2
  accumulation_steps: 2
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 10000
  log_interval: 50
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "wandb"
  wandb_project: "specforge-lfm2.5-1.2b-instruct-dflash"
  wandb_name: "lfm2.5-1.2b-instruct-dflash-perfectblend-8layers"
run_id: "lfm2.5-1.2b-instruct-dflash-online"
output_dir: "./outputs/lfm2.5-1.2b-instruct-dflash-online"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/lfm2.5-1.2b-instruct-dflash-online/control
    consumer_state_dir: outputs/lfm2.5-1.2b-instruct-dflash-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
