model:
  target_model_path: /mnt/checkpoint/Qwen3-8B
  draft_model_config: /workspace/SpecForge/configs/qwen3-8b-dflash.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true

data:
  train_data_path: /mnt/datasets/perfectblend/qwen3-8b/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: /workspace/cache/qwen3-8b-dflash-perfectblend-no-system-8192

training:
  strategy: dflash
  num_epochs: 6
  tp_size: 1
  batch_size: 2
  accumulation_steps: 2
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dflash_teacher_metrics: false
  save_interval: 3000
  max_checkpoints: 3
  log_interval: 50
  dist_timeout: 30
  seed: 42

tracking:
  report_to: tensorboard

runtime:
  producer_lease: 4
  producer_concurrency: 4
  in_flight_high_watermark: 1024
  in_flight_low_watermark: 512

run_id: qwen3-8b-dflash-perfectblend-l20n-20260930-002
output_dir: /mnt/checkpoint/qwen3-8b-dflash-perfectblend-l20n-20260930-002

