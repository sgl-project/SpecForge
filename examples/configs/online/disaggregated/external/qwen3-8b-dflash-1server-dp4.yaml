# 4-rank variant of qwen3-8b-dflash.yaml with one external capture server.
# Disables experiment reporting (report_to: none).
model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    schema_version: 1
    hidden_size: 4096
    num_hidden_layers: 5
    num_attention_heads: 32
    hidden_act: silu
    initializer_range: 0.02
    rms_norm_eps: 1.0e-06
    attention_bias: false
    attention_dropout: 0.0
    bos_token_id: 151643
    eos_token_id: 151645
    use_cache: true
    tie_word_embeddings: false
    dtype: bfloat16
    vocab_size: 151936
    intermediate_size: 12288
    max_position_embeddings: 40960
    num_key_value_heads: 8
    head_dim: 128
    architectures:
    - DFlashDraftModel
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    dflash_config:
      mask_token_id: 151669
      target_layer_ids:
      - 1
      - 9
      - 17
      - 25
      - 33
      projector_type: null
      pure_draft_prefix_len: 0
      shift_label: false
    model_type: qwen3
    num_target_layers: 36
    rope_scaling: null
    rope_theta: 1000000
    layers:
      attention:
        type: gqa
        is_causal: false
  target_backend: sglang
data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 3072
  chat_template: qwen
  cache_dir: cache
  build_dataset_num_proc: 32
training:
  strategy: dflash
  num_epochs: 6
  max_steps: 10000
  batch_size: 4
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 7.0
  save_interval: 1000
  dist_timeout: 30
  seed: 42
tracking:
  report_to: none
  wandb_project: qwen3-8b-dflash-disagg
  wandb_name: qwen3-8b-dflash-disagg-dp4
run_id: qwen3-8b-dflash-disaggregated
output_dir: outputs/qwen3-8b-dflash-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3-8b-dflash-disaggregated/control
    consumer_state_dir: outputs/qwen3-8b-dflash-disaggregated/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
