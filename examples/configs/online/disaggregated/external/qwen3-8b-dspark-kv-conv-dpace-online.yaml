model:
  conditioning_source: kv
  target_model_path: shared/checkpoint/Qwen3-8B
  draft_model_config: configs/qwen3-8b-dspark-kv-conv-causal-noconf-b16.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true
data:
  train_data_path: shared/datasets/perfectblend/qwen3-8b/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: cache/qwen3-8b-dspark-kv-conv-dpace
training:
  strategy: dspark
  loss_type: dpace
  dpace_alpha: 0.5
  num_epochs: 6
  batch_size: 2
  accumulation_steps: 2
  fsdp_sharding: NO_SHARD
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  save_interval: 3000
  log_interval: 10
  seed: 42
tracking:
  report_to: tensorboard
runtime:
  producer_lease: 8
  producer_concurrency: 4
  in_flight_high_watermark: 128
  in_flight_low_watermark: 64
run_id: qwen3-8b-dspark-kv-conv-dpace-online
output_dir: outputs/qwen3-8b-dspark-kv-conv-dpace-online
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3-8b-dspark-kv-conv-dpace-online/control
    backend: mooncake
    server_urls: [http://127.0.0.1:30000]
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
    receive_buffers: pinned
    async_ack: true
