model:
  target_model_path: /mnt/checkpoint/Qwen3-8B
  draft_model_config: /workspace/SpecForge/configs/qwen3-8b-dspark-causal-noconf-b16.json
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true

data:
  train_data_path: /mnt/datasets/perfectblend/qwen3-8b/perfectblend_train_regen_temperature0_no_think.jsonl
  max_length: 8192
  chat_template: qwen3-instruct
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: /workspace/cache/qwen3-8b-dflash-perfectblend-no-system-8192

training:
  strategy: dspark
  num_epochs: 6
  total_steps: null
  max_steps: null
  tp_size: 1
  batch_size: 2
  accumulation_steps: 2
  fsdp_sharding: NO_SHARD
  ddp_bucket_cap_mb: 128
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 7.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 0.0
  dspark_flatten_projection: true
  dspark_cache_projection: true
  save_interval: 3000
  max_checkpoints: 1
  log_interval: 10
  dist_timeout: 30
  seed: 42

tracking:
  report_to: tensorboard

runtime:
  consumer_dispatch: cost_balanced
  producer_lease: 8
  producer_concurrency: 4
  in_flight_high_watermark: 1536
  in_flight_low_watermark: 768

run_id: qwen3-8b-dspark-causal-noconf-b16-l20n-32c8p-6ep-20261007-004
output_dir: /mnt/checkpoint/qwen3-8b-dspark-causal-noconf-b16-l20n-32c8p-6ep-20261007-004

deployment:
  mode: disaggregated
  trainer:
    nnodes: 4
    nproc_per_node: 8
    master_addr: 192.168.6.72
    master_port: 29500
  disaggregated:
    control_dir: /mnt/runs/qwen3-8b-dspark-causal-noconf-b16-l20n-32c8p-6ep-20261007-004/control
    consumer_state_dir: /workspace/runs/qwen3-8b-dspark-causal-noconf-b16-l20n-32c8p-6ep-20261007-004/consumer-state
    backend: mooncake
    store_id: qwen3-8b-dspark-causal-noconf-b16-l20n-32c8p-6ep-20261007-004
    server_urls:
      - http://192.168.6.68:30000
      - http://192.168.6.68:30001
      - http://192.168.6.68:30002
      - http://192.168.6.68:30003
      - http://192.168.6.68:30004
      - http://192.168.6.68:30005
      - http://192.168.6.68:30006
      - http://192.168.6.68:30007
    mooncake_metadata_server: http://192.168.6.68:35880/metadata
    mooncake_master_server_addr: 192.168.6.68:35551
    mooncake_protocol: tcp
    client_buffer_size: 2147483648
    receive_buffers: pinned
    async_ack: true
    idle_timeout_s: 1800
    peer_wait_timeout_s: 1800

profiling:
  enabled: false
