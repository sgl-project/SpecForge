model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  draft_model_config: configs/deepseek-v4-flash-dspark.json
  target_backend: sglang
  trust_remote_code: true
  # DeepSeek-V4 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.88
  # data.max_length plus headroom: capture rejects inputs at exactly the
  # context length.
  sglang_context_length: 33280
  sglang_max_running_requests: 8
  # The checkpoint's routed experts are fp4; the default MoE path cannot run
  # them on B200.
  sglang_moe_runner_backend: flashinfer_mxfp4

data:
  # Recorded production traffic rendered with the native encoding_dsv4
  # encoder (scripts/transform_traffic_recordings.py) and trimmed to <=32768
  # tokens at complete-turn boundaries (scripts/trim_dataset_to_max_tokens.py)
  # so no supervised span is cut mid-tool-call.
  train_data_path: ./cache/dataset/dsv4_flash_0813_32k_train.jsonl
  is_preformatted: true
  max_length: 32768
  chat_template: deepseek-v4
  cache_dir: cache
  cache_key: dsv4-flash-0813-32k-full
  # The one-time dataset build tokenizes every row (hours at this corpus
  # size); set data.max_prompts for a quick smoke run.
  build_dataset_num_proc: 64
  # 16 fetch threads/rank: a 32K step moves ~25 GiB per rank and one loopback
  # TCP stream tops out ~0.3-0.6 GB/s.
  dataloader_num_workers: 16

training:
  strategy: dspark
  num_epochs: 4
  # 2 ranks x 32 microbatches = 64 sequences per step. Two trainer ranks free
  # GPUs for a third capture server: at 32K, capture (not compute) binds a
  # larger trainer.
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 256
  log_interval: 5
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge
  wandb_name: deepseek-v4-flash-dspark-0813-32k
  wandb_dir: outputs/deepseek-v4-flash-dspark-0813-32k/wandb

runtime:
  # Lease commitment is the real backpressure overshoot: once dispatch
  # resumes, workers x concurrency x lease samples publish regardless of the
  # watermark. High watermark + full commitment must stay under the hard cap.
  producer_lease: 4
  producer_concurrency: 4
  # One optimizer quantum is 64 samples (~90 GiB of features). Narrow
  # hysteresis: a low watermark at exactly one quantum lets in_flight scrape
  # below a full optimizer window and starve steps.
  in_flight_high_watermark: 128
  in_flight_low_watermark: 112
  resident_high_watermark_bytes: 171798691840     # 160 GiB
  resident_low_watermark_bytes: 161061273600      # 150 GiB
  feature_store_max_resident_bytes: 412316860416  # 384 GiB

run_id: deepseek-v4-flash-dspark-0813-32k
output_dir: outputs/deepseek-v4-flash-dspark-0813-32k

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: outputs/deepseek-v4-flash-dspark-0813-32k/control
    consumer_state_dir: outputs/deepseek-v4-flash-dspark-0813-32k/consumer-state
    backend: mooncake
    store_id: deepseek-v4-flash-dspark-0813-32k
    # Three TP2 capture servers (scripts/launch_dsv4_0813_32k.sh): TP prefill
    # scaling is sublinear, so several small servers out-produce one large.
    server_urls:
      - http://127.0.0.1:30000
      - http://127.0.0.1:30001
      - http://127.0.0.1:30002
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    # A 32K sample is ~1.6 GiB transferred as one object; the client buffer
    # must hold it.
    client_buffer_size: 2147483648
    # Must cover the one-time full-corpus tokenization: consumer ranks wait
    # on the producer's schedule file for this long on a cold-cache launch.
    idle_timeout_s: 21600
    peer_wait_timeout_s: 21600
