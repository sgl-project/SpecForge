model:
  target_model_path: Qwen/Qwen3-8B
  draft_model_config:
    emb_dim: 256
    architectures: [DominoDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: domino.DominoDraftModel
    block_size: 16
    bos_token_id: 151643
    dflash_config:
      mask_token_id: 151669
      target_layer_ids: [1, 9, 17, 25, 33]
      projector_type: domino
      pure_draft_prefix_len: 1
      emb_dim: 256
      gru_hidden_dim: 1024
      shift_label: true
    dtype: bfloat16
    eos_token_id: 151645
    head_dim: 128
    hidden_act: silu
    hidden_size: 4096
    initializer_range: 0.02
    intermediate_size: 12288
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 40960
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 36
    rms_norm_eps: 1.0e-06
    rope_scaling: null
    rope_theta: 1000000
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 151936
  target_backend: sglang
  embedding_key: model.embed_tokens.weight
  torch_dtype: bfloat16

data:
  train_data_path: ./cache/dataset/sharegpt_train.jsonl
  max_length: 3072
  chat_template: qwen
  build_dataset_num_proc: 32
  cache_dir: ./cache

training:
  strategy: domino
  num_epochs: 6
  batch_size: 2
  learning_rate: 6.0e-4
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 256
  loss_decay_gamma: 7.0
  lambda_base_start: 1.0
  lambda_base_decay_ratio: 1.0
  save_interval: 2000
  log_interval: 50
  dist_timeout: 30
  seed: 42

tracking:
  report_to: wandb
  wandb_project: specforge-qwen3-8b-domino
  wandb_name: qwen3-8b-domino_sharegpt

run_id: qwen3-8b-domino-online
output_dir: ./outputs/qwen3-8b-domino-online

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: outputs/qwen3-8b-domino-online/control
    consumer_state_dir: outputs/qwen3-8b-domino-online/consumer-state
    backend: mooncake
    server_urls:
      - http://127.0.0.1:30000
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_protocol: tcp
