model:
  target_model_path: "Qwen/Qwen3.6-27B"
  draft_model_config:
    architectures: [DFlashDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dflash.DFlashDraftModel
    block_size: 16
    bos_token_id: null
    dflash_config:
      mask_token_id: 248070
      target_layer_ids: [1, 16, 31, 46, 61]
    dtype: bfloat16
    eos_token_id: 248044
    head_dim: 128
    hidden_act: silu
    hidden_size: 5120
    initializer_range: 0.02
    intermediate_size: 17408
    layer_types: [sliding_attention, sliding_attention, sliding_attention, sliding_attention, full_attention]
    max_position_embeddings: 262144
    max_window_layers: 5
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    num_target_layers: 64
    pad_token_id: 248044
    rms_norm_eps: 1.0e-06
    sliding_window: 2048
    tie_word_embeddings: false
    transformers_version: 5.5.3
    use_cache: true
    use_sliding_window: true
    vocab_size: 248320
    rope_theta: 10000000
    rope_scaling: null
  target_backend: "sglang"
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/nemotron_v2_train.jsonl"
  max_length: 2048
  chat_template: "qwen3.5"
  build_dataset_num_proc: 32
  cache_dir: "./cache"
training:
  strategy: "dflash"
  num_epochs: 6
  max_steps: 10000
  batch_size: 1
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: "flex_attention"
  num_anchors: 512
  loss_decay_gamma: 7
  save_interval: 1000
  log_interval: 10
  dist_timeout: 30
  seed: 42
tracking:
  report_to: "none"
  wandb_project: "qwen36-dflash-disagg"
  wandb_name: "qwen36-27b-dflash-1srv-dp2"
run_id: "qwen3.6-27b-dflash-1server-dp2-disaggregated"
output_dir: "./outputs/qwen3.6-27b-dflash-1server-dp2-disaggregated"

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: outputs/qwen3.6-27b-dflash-1server-dp2-disaggregated/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
        - "2"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.85
