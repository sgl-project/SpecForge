model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config: configs/qwen3.6-27b-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
  mask_token_id: 248070
data:
  train_data_path: "./cache/dataset/nemotron_v2_train.jsonl"
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64
training:
  strategy: dspark
  num_epochs: 10
  # Portable one-rank equivalent of the source recipe's global batch 512.
  batch_size: 1
  accumulation_steps: 512
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 125
  dist_timeout: 30
  seed: 42
run_id: qwen3.6-27b-dspark-disaggregated
output_dir: outputs/qwen3.6-27b-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3.6-27b-dspark-disaggregated/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.7
