model:
  target_model_path: Qwen/Qwen3.6-27B
  draft_model_config:
    architectures: [DSparkDraftModel]
    attention_bias: false
    attention_dropout: 0.0
    auto_map:
      AutoModel: dspark.DSparkDraftModel
    dflash_config:
      attention_mode: gqa
      confidence_head_alpha: 1.0
      confidence_head_with_markov: true
      enable_confidence_head: true
      markov_head_type: vanilla
      markov_rank: 256
      mask_token_id: 248070
      projector_type: dspark
      target_layer_ids: [2, 17, 32, 47, 62]
    block_size: 16
    dtype: bfloat16
    target_hidden_size: null
    bos_token_id: null
    eos_token_id: 248044
    head_dim: 128
    hidden_act: silu
    hidden_size: 5120
    initializer_range: 0.02
    intermediate_size: 17408
    layer_types: [full_attention, full_attention, full_attention, full_attention, full_attention]
    max_position_embeddings: 262144
    max_window_layers: 28
    model_type: qwen3
    num_attention_heads: 32
    num_hidden_layers: 5
    num_key_value_heads: 8
    pad_token_id: 248044
    rms_norm_eps: 1.0e-06
    rope_theta: 10000000
    rope_scaling: null
    num_target_layers: 64
    sliding_window: null
    tie_word_embeddings: false
    use_cache: true
    use_sliding_window: false
    vocab_size: 248320
  target_backend: sglang
  trust_remote_code: true
  embedding_key: "model.language_model.embed_tokens.weight"
  torch_dtype: "bfloat16"
data:
  train_data_path: "./cache/dataset/nemotron_v2_train.jsonl"
  max_length: 4096
  chat_template: qwen3.5
  cache_dir: cache
  build_dataset_num_proc: 64
training:
  strategy: dspark
  num_epochs: 10
  # Portable one-rank equivalent of the source recipe's global batch 512.
  batch_size: 1
  accumulation_steps: 512
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  save_interval: 125
  dist_timeout: 30
  seed: 42
run_id: qwen3.6-27b-dspark-disaggregated
output_dir: outputs/qwen3.6-27b-dspark-disaggregated

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 1
  disaggregated:
    control_dir: outputs/qwen3.6-27b-dspark-disaggregated/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
        - "1"
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
      capture_servers:
        - port: 30000
          cuda_visible_devices:
            - "0"
          tp_size: 1
          mem_fraction_static: 0.7
