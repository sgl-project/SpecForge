# Qwen3.8-27B DSpark drafter, trained from scratch on the full
# RadixArk/Qwen3.8-27B-Regen-Mixture-v1 corpus (1,270,018 conversations).
#
# Reproduces the RadixArk/Qwen3.8-27B-DSpark-v2 recipe (six epochs, global
# batch 512, 250-step linear warmup into constant 5e-4, 8,192-token context,
# NVFP4 target) on one 8-GPU B200 node: four TP1 NVFP4 capture servers on
# GPUs 0-3 and a four-rank FSDP trainer on GPUs 4-7.
#
# Run from the repository root with PYTHONPATH pointing at this checkout:
#   PYTHONPATH=$PWD MC_TRANSFER_TIMEOUT=300 python -m specforge.cli train \
#     -c examples/configs/online/disaggregated/managed-local/qwen3.8-27b-dspark-regen-mixture-v1-6ep.yaml
model:
  # NVFP4 body (matches the regen backend) with the source BF16 lm_head so the
  # trainer can load the frozen target head/embedding directly.
  target_model_path: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: configs/qwen3.8-27b-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  # Same id as the official Qwen3.5/3.6/3.8 drafters. In the Qwen3.8 tokenizer
  # this is <|audio_start|>, which never occurs in text-only training data.
  mask_token_id: 248070
  # Hybrid GDN targets on Blackwell accept only triton, trtllm_mha or fa4.
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_max_running_requests: 8

data:
  train_data_path: cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  # Concurrent feature fetches per trainer rank (one Mooncake read each).
  dataloader_num_workers: 16

training:
  strategy: dspark
  num_epochs: 6
  # 4 ranks x 128 microbatches -> global batch 512 (14,874 optimizer steps).
  batch_size: 1
  accumulation_steps: 128
  learning_rate: 0.0005
  lr_scheduler: constant
  # 250 warmup steps of 14,874.
  warmup_ratio: 0.0168
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 1
  dist_timeout: 60
  seed: 42
  prompt_seed: 42

tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-ablation
  wandb_name: qwen3.8-27b-dspark-regen-mixture-v1-6ep-b200-dp4
  wandb_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-6ep/wandb

runtime:
  producer_lease: 8
  producer_concurrency: 16
  # Up to ~0.42 GiB of aux features per 8k sample (5 layers x 5120 x bf16,
  # ~0.18 GiB at the corpus mean of 3.6k tokens). The high watermark must be
  # at least the global optimizer quantum (512); keep two quanta in flight.
  in_flight_high_watermark: 1024
  in_flight_low_watermark: 512
  # Resident-byte bounds sized for 1024 in-flight 8k samples (~430 GiB worst
  # case) within the 600 GiB of Mooncake segments; the hard cap aborts the
  # producer when exceeded.
  resident_high_watermark_bytes: 483183820800
  resident_low_watermark_bytes: 322122547200
  feature_store_max_resident_bytes: 590558003200

run_id: qwen3.8-27b-dspark-regen-mixture-v1-6ep
output_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-6ep

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-6ep/control
    consumer_state_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-6ep/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices: ["4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        # Each capture server mounts this much host memory (4 x 150 GiB), enough
        # for 1024 in-flight samples even at the 8k-token maximum.
        global_segment_size_bytes: 161061273600
        local_buffer_size_bytes: 1073741824
        # Multi-hundred-MB feature objects need a long lease (5 min).
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
        - port: 30001
          cuda_visible_devices: ["1"]
          tp_size: 1
        - port: 30002
          cuda_visible_devices: ["2"]
          tp_size: 1
        - port: 30003
          cuda_visible_devices: ["3"]
          tp_size: 1
