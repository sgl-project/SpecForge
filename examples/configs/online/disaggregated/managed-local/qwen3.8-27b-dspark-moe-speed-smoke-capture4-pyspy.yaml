# Re-run of ...-speed-smoke-capture4 (identical settings) so the sglang capture scheduler can be py-spy sampled in steady state.
model:
  target_model_path: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: /personal/SpecForge-qwen38-moe/configs/qwen3.8-27b-dspark-moe-v2.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536
data:
  train_data_path: /personal/SpecForge-qwen38/cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /personal/SpecForge-qwen38/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 16
training:
  strategy: dspark
  num_epochs: 1
  batch_size: 4
  accumulation_steps: 16
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 10000
  max_checkpoints: 3
  log_interval: 1
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
  max_steps: 10
tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-ablation
  wandb_name: qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy-b200-dp4
  wandb_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 16
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  resident_high_watermark_bytes: 322122547200
  resident_low_watermark_bytes: 214748364800
  feature_store_max_resident_bytes: 408021893120
run_id: qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy
output_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy/control
    consumer_state_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-speed-smoke-capture4-pyspy/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices:
      - '4'
      - '5'
      - '6'
      - '7'
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        default_kv_lease_ttl_ms: 300000
      capture_servers:
      - port: 30000
        cuda_visible_devices:
        - '0'
        tp_size: 1
      - port: 30001
        cuda_visible_devices:
        - '1'
        tp_size: 1
      - port: 30002
        cuda_visible_devices:
        - '2'
        tp_size: 1
      - port: 30003
        cuda_visible_devices:
        - '3'
        tp_size: 1
profiling:
  enabled: false
