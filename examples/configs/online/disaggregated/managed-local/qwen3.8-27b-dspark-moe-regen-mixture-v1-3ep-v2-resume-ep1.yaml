# MoE-v2 resumed from its step-1000 checkpoint to finish epoch 1 (max_steps 2479), single node (4 capture +
# 4 trainer ranks), non-managed disaggregated because managed_local refuses resume. Same drafter/optimizer/
# micro-batching as v2 so the recorded schedule matches; checkpoints keep landing in the v2 output dir.
# Launch (on the idle node): outputs/launch/launch-moe-disagg-manual-on-103.sh <this yaml>
model:
  target_model_path: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: /personal/SpecForge-qwen38-moe/configs/qwen3.8-27b-dspark-moe-v2.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 2
  sglang_max_total_tokens: 32768
data:
  train_data_path: /personal/SpecForge-qwen38/cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /personal/SpecForge-qwen38/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 3
  batch_size: 2
  accumulation_steps: 64
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
  resume_from: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2-step1000
  max_steps: 2479
tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-ablation
  wandb_name: qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2-resume-ep1-b200-dp4
  wandb_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 8
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  resident_high_watermark_bytes: 322122547200
  resident_low_watermark_bytes: 214748364800
  feature_store_max_resident_bytes: 408021893120
run_id: qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2-resume-ep1
output_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2-resume-ep1/control
    consumer_state_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-regen-mixture-v1-3ep-v2/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
    - http://127.0.0.1:30000
    - http://127.0.0.1:30001
    - http://127.0.0.1:30002
    - http://127.0.0.1:30003
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
