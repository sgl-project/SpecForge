# Epochs 2-3 of the Qwen3.8-27B DSpark MoE 16 x 1024 top-2 drafter on TWO 4x GB300 nodes (gb300-coreweave), as a
# weights-only warm start from the epoch-1 checkpoint of qwen3.8-27b-dspark-moe-16x1024-3ep-gb300 (step 4958).
#   - capture node (CAPTURE_IP, the box that trained epoch 1): 4 TP1 NVFP4 capture servers (same target as epoch 1),
#     4 running requests each, 100 GiB Mooncake segment each.
#   - trainer node (TRAINER_IP): mooncake_master + producer + 4-rank FSDP trainer, batch_size 4 x accumulation 16 x
#     4 ranks = 256, AdamW on the GPUs.
# Same settings as the H200 two-node recipe otherwise (see qwen3.8-27b-dspark-moe-16x1024-cont2ep-2node-h200.yaml);
# Mooncake protocol rdma if the coreweave fabric passes the same bandwidth test, else tcp (200 GbE pod network).
model:
  target_model_path: /scratch/models/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: /scratch/SpecForge/configs/qwen3.8-27b-dspark-moe-16x1024.json
  draft_checkpoint_path: /scratch/moe16/warmstart/qwen3.8-27b-dspark-moe-16x1024-3ep-gb300-step4958
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 32768
data:
  train_data_path: /scratch/data/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /scratch/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 2
  batch_size: 4
  accumulation_steps: 16
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: false
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 2479
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-dspark-moe-16x1024
  wandb_name: qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300
  wandb_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 16
  in_flight_high_watermark: 384
  in_flight_low_watermark: 256
  resident_high_watermark_bytes: 206158430208
  resident_low_watermark_bytes: 137438953472
  feature_store_max_resident_bytes: 274877906944
run_id: qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300
output_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300/control
    consumer_state_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-gb300/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
    - http://CAPTURE_IP:30000
    - http://CAPTURE_IP:30001
    - http://CAPTURE_IP:30002
    - http://CAPTURE_IP:30003
    mooncake_metadata_server: http://TRAINER_IP:35880/metadata
    mooncake_master_server_addr: TRAINER_IP:35551
    mooncake_local_hostname: TRAINER_IP
    mooncake_protocol: rdma
