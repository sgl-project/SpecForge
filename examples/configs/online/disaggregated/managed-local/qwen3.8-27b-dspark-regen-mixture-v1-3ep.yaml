# Qwen3.8-27B DSpark drafter, trained from scratch on the full
# RadixArk/Qwen3.8-27B-Regen-Mixture-v1 corpus (1,269,290 conversations).
#
# Second attempt after the 6-epoch run (W&B idzm0hdo) died at step 1393 when
# the four capture-server schedulers, each hosting a 150 GiB Mooncake segment,
# filled NUMA node 0 (685 GB) and the kernel OOM-killed one of them. This
# recipe keeps the DSpark objective and the DP4 layout but adopts the settings
# from the official qwen38-27b-dflash2 GB300 run that transfer to DSpark:
#   - three epochs at global batch 512 (7,437 optimizer steps, ~5 days on one
#     B200 node at the measured ~61 s/step), 4% linear warmup into constant 5e-4
#   - capture servers bounded to two running requests / 32k pool tokens with
#     the radix cache off and an explicit 8,199-token context
#   - dist_timeout 15 min (minutes!) so a dead producer fails fast instead of
#     parking the trainer in an hour-long NCCL wait, log_interval 10
# and halves the Mooncake footprint (4 x 100 GiB segments, 768 in-flight
# samples) so node 0 stays under ~450 GB.
#
# Not adopted: deployment.mode=local_colocated (online colocated training is
# rejected by this codebase; see launch_plan.build_launch_plan), the DFlash2
# loss_decay_gamma 7.0 / selector loss (every DSpark recipe uses 4.0 and the
# CE/L1/confidence mix), and batch_size 2 (untested at 8k on 180 GB B200s —
# try it in a smoke run before switching; global batch stays 512 with
# accumulation_steps 64).
#
# Run from the repository root with PYTHONPATH pointing at this checkout:
#   PYTHONPATH=$PWD MC_TRANSFER_TIMEOUT=300 python -m specforge.cli train \
#     -c examples/configs/online/disaggregated/managed-local/qwen3.8-27b-dspark-regen-mixture-v1-3ep.yaml
model:
  # NVFP4 body (matches the regen backend) with the source BF16 lm_head so the
  # trainer can load the frozen target head/embedding directly.
  target_model_path: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: configs/qwen3.8-27b-dspark.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  # Same id as the official Qwen3.5/3.6/3.8 drafters. In the Qwen3.8 tokenizer
  # this is <|audio_start|>, which never occurs in text-only training data.
  mask_token_id: 248070
  # Hybrid GDN targets on Blackwell accept only triton, trtllm_mha or fa4.
  sglang_attention_backend: triton
  # Capture servers own their GPUs here (the official colocated run shared each
  # GPU with a trainer rank and used 0.30).
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  # max_length + 7 headroom, as in the official run.
  sglang_context_length: 8199
  # Bound per-server concurrency and KV pool like the official run; capture
  # was ~4x faster than the trainer needed, so this costs no throughput and
  # caps host-side sink buffers.
  sglang_max_running_requests: 2
  sglang_max_total_tokens: 32768

data:
  # Same JSONL as the 6-epoch run; the tokenized shards in cache_dir are keyed
  # by content hash + max_length + template and are reused as-is.
  train_data_path: cache/dataset/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  # Concurrent feature fetches per trainer rank (one Mooncake read each). The
  # trainer is compute-bound at ~61 s/step, so 8 (official value) is plenty.
  dataloader_num_workers: 8

training:
  strategy: dspark
  num_epochs: 3
  # 4 ranks x 128 microbatches -> global batch 512 (7,437 optimizer steps).
  batch_size: 1
  accumulation_steps: 128
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0005
  lr_scheduler: constant
  # ~297 warmup steps of 7,437 (official run and every sibling DSpark recipe).
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 500
  max_checkpoints: 3
  log_interval: 10
  # Minutes. The 6-epoch run used 60 and sat in a dead allreduce for an hour
  # after the producer was killed.
  dist_timeout: 15
  seed: 42
  prompt_seed: 42

tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-ablation
  wandb_name: qwen3.8-27b-dspark-regen-mixture-v1-3ep-b200-dp4
  wandb_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-3ep/wandb

runtime:
  producer_lease: 8
  # 4 capture servers x 2 running requests.
  producer_concurrency: 8
  # Up to ~0.42 GiB of aux features per 8k sample (5 layers x 5120 x bf16,
  # ~0.18 GiB at the corpus mean of 3.6k tokens). The high watermark must be
  # at least the global optimizer quantum (512) and so must the low watermark; 1.5 quanta in flight keeps
  # the trainer fed while halving the host footprint of the 6-epoch run.
  in_flight_high_watermark: 768
  in_flight_low_watermark: 512
  # 300 / 200 GiB resident bounds and a 380 GiB hard cap, inside the 400 GiB
  # of Mooncake segments below (768 x 0.42 GiB worst case = 322 GiB).
  resident_high_watermark_bytes: 322122547200
  resident_low_watermark_bytes: 214748364800
  feature_store_max_resident_bytes: 408021893120

run_id: qwen3.8-27b-dspark-regen-mixture-v1-3ep
output_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-3ep

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-3ep/control
    consumer_state_dir: outputs/qwen3.8-27b-dspark-regen-mixture-v1-3ep/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    managed_local:
      trainer_cuda_visible_devices: ["4", "5", "6", "7"]
      mooncake:
        protocol: tcp
        # Each capture server mounts this much host memory (4 x 100 GiB). The
        # segment pages get touched over the run, so the scheduler RSS grows
        # to this size: 400 GiB total keeps NUMA node 0 (685 GB) safe.
        global_segment_size_bytes: 107374182400
        local_buffer_size_bytes: 1073741824
        # Multi-hundred-MB feature objects need a long lease (5 min).
        default_kv_lease_ttl_ms: 300000
      capture_servers:
        - port: 30000
          cuda_visible_devices: ["0"]
          tp_size: 1
        - port: 30001
          cuda_visible_devices: ["1"]
          tp_size: 1
        - port: 30002
          cuda_visible_devices: ["2"]
          tp_size: 1
        - port: 30003
          cuda_visible_devices: ["3"]
          tp_size: 1
