model:
  target_model_path: Qwen/Qwen3.8-27B-FP8
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  torch_dtype: bfloat16
  use_liger_kernel: true
  sglang_attention_backend: fa3
  sglang_linear_attn_prefill_backend: flashinfer
  sglang_extra_args:
  - --cuda-graph-backend-decode
  - disabled
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
data:
  train_data_path: ./cache/dataset/qwen3.8-27b-regen-train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  build_dataset_num_proc: 32
  dataloader_num_workers: 8
  cache_dir: cache/qwen3.8-27b-dflash2
training:
  loss:
    fused: true
    scheduling:
      chunk_size: 128
      checkpoint: false
    terms:
      selector:
        coefficient: 1.0
  weighting:
    kind: exponential
    gamma: 7.0
  num_epochs: 1
  tp_size: 1
  batch_size: 2
  accumulation_steps: 6
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.05
  max_grad_norm: 1.0
  attention_backend: flex_attention
  dflash_teacher_metrics: false
  save_interval: 500
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 42
  objective_options:
    num_anchors: 512
    selector_stop_gradient: false
tracking:
  report_to: none
runtime:
  producer_lease: 4
  producer_concurrency: 4
  in_flight_high_watermark: 288
  in_flight_low_watermark: 144
run_id: qwen3.8-27b-dflash2-h200-5server-dp3-disaggregated
output_dir: outputs/qwen3.8-27b-dflash2-h200-5server-dp3-disaggregated
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 3
  disaggregated:
    control_dir: outputs/qwen3.8-27b-dflash2-h200-5server-dp3-disaggregated/control
    consumer_state_dir: outputs/qwen3.8-27b-dflash2-h200-5server-dp3-disaggregated/consumer-state
    backend: mooncake
    client_buffer_size: 2147483648
    managed_local:
      trainer_cuda_visible_devices:
      - '5'
      - '6'
      - '7'
      mooncake:
        protocol: rdma
        rdma_devices: mlx5_0,mlx5_1,mlx5_2,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7
        default_kv_lease_ttl_ms: 10000
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 4294967296
      capture_servers:
      - port: 30000
        cuda_visible_devices:
        - '0'
        tp_size: 1
        mem_fraction_static: 0.85
      - port: 30001
        cuda_visible_devices:
        - '1'
        tp_size: 1
        mem_fraction_static: 0.85
      - port: 30002
        cuda_visible_devices:
        - '2'
        tp_size: 1
        mem_fraction_static: 0.85
      - port: 30003
        cuda_visible_devices:
        - '3'
        tp_size: 1
        mem_fraction_static: 0.85
      - port: 30004
        cuda_visible_devices:
        - '4'
        tp_size: 1
        mem_fraction_static: 0.85
draft: specforge/config/draft/presets/qwen3.8-27b-dflash2.yaml
