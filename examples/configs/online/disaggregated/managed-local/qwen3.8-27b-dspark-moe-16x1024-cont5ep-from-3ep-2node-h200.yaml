# Epochs 4-8 of the Qwen3.8-27B DSpark MoE 16 x 1024 top-2 drafter on the same two 8x H200 nodes: weights-only warm
# start from the epoch-3 checkpoint of the epochs-2-3 run (qwen3.8-27b-dspark-moe-16x1024-cont2ep-from-1ep-2node-h200,
# continuation step 9916), five epochs = 24,790 steps at global batch 256, checkpoint every 2,479 steps so every epoch
# end (continuation steps 4958 / 9916 / 14874 / 19832 / 24790 = epochs 4-8) is exported and uploaded to
# RadixArk/qwen38-dspark-moe-16x1024-{4..8}ep. Everything else (capture node, trainer node, Mooncake RDMA, bf16 teacher,
# optimizer, loss, watermarks) is identical to qwen3.8-27b-dspark-moe-16x1024-cont2ep-2node-h200.yaml; the optimizer
# moments and the 4% lr warm-up restart at the phase boundary as in Kan's phases.
model:
  target_model_path: /scratch/models/Qwen3.8-27B
  draft_model_config: /scratch/SpecForge/configs/qwen3.8-27b-dspark-moe-16x1024.json
  draft_checkpoint_path: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200-step9916
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 32768
data:
  train_data_path: /scratch/data/qwen38_regen_mixture_v1_train.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /scratch/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 8
training:
  strategy: dspark
  num_epochs: 5
  batch_size: 4
  accumulation_steps: 8
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: false
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 2479
  max_checkpoints: 3
  log_interval: 10
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-dspark-moe-16x1024
  wandb_name: qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200
  wandb_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 32
  in_flight_high_watermark: 512
  in_flight_low_watermark: 384
  resident_high_watermark_bytes: 481036337152
  resident_low_watermark_bytes: 343597383680
  feature_store_max_resident_bytes: 687194767360
run_id: qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200
output_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200/control
    consumer_state_dir: /scratch/moe16/outputs/qwen3.8-27b-dspark-moe-16x1024-cont5ep-from-3ep-2node-h200/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
    - http://CAPTURE_IP:30000
    - http://CAPTURE_IP:30001
    - http://CAPTURE_IP:30002
    - http://CAPTURE_IP:30003
    - http://CAPTURE_IP:30004
    - http://CAPTURE_IP:30005
    - http://CAPTURE_IP:30006
    - http://CAPTURE_IP:30007
    mooncake_metadata_server: http://TRAINER_IP:35880/metadata
    mooncake_master_server_addr: TRAINER_IP:35551
    mooncake_local_hostname: TRAINER_IP
    mooncake_protocol: rdma
