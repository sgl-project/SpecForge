# Two-node smoke: 8-rank trainer on .102, 6 capture servers on .103, 64 samples/step, 16 steps.
model:
  target_model_path: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
  draft_model_config: /personal/SpecForge-qwen38-moe/configs/qwen3.8-27b-dspark-moe-v2.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  load_target_embedding: true
  torch_dtype: bfloat16
  mask_token_id: 248070
  sglang_attention_backend: triton
  sglang_mem_fraction_static: 0.85
  sglang_disable_radix_cache: true
  sglang_context_length: 8199
  sglang_max_running_requests: 4
  sglang_max_total_tokens: 65536
data:
  train_data_path: /personal/SpecForge-qwen38/cache/dataset/qwen38_regen_mixture_v1_smoke.jsonl
  max_length: 8192
  chat_template: qwen3.5
  cache_dir: /personal/SpecForge-qwen38/cache/qwen3.8-27b-regen-mixture-v1
  build_dataset_num_proc: 64
  dataloader_num_workers: 48
training:
  strategy: dspark
  num_epochs: 1
  batch_size: 4
  accumulation_steps: 2
  fsdp_sharding: FULL_SHARD
  optimizer_cpu_offload: true
  learning_rate: 0.0005
  lr_scheduler: constant
  warmup_ratio: 0.1
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 100000
  max_checkpoints: 3
  log_interval: 1
  dist_timeout: 15
  seed: 42
  prompt_seed: 42
  max_steps: 16
tracking:
  report_to: wandb
  wandb_project: specforge-qwen38-ablation
  wandb_name: qwen3.8-27b-dspark-moe-2node-smoke
  wandb_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-2node-smoke/wandb
runtime:
  producer_lease: 8
  producer_concurrency: 24
  in_flight_high_watermark: 128
  in_flight_low_watermark: 64
  resident_high_watermark_bytes: 483183820800
  resident_low_watermark_bytes: 322122547200
  feature_store_max_resident_bytes: 601295421440
run_id: qwen3.8-27b-dspark-moe-2node-smoke
output_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-2node-smoke
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 8
  disaggregated:
    control_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-2node-smoke/control
    consumer_state_dir: /personal/SpecForge-qwen38-moe/outputs/qwen3.8-27b-dspark-moe-2node-smoke/consumer-state
    backend: mooncake
    client_buffer_size: 1073741824
    server_urls:
    - http://10.13.114.103:30000
    - http://10.13.114.103:30001
    - http://10.13.114.103:30002
    - http://10.13.114.103:30003
    - http://10.13.114.103:30004
    - http://10.13.114.103:30005
    mooncake_metadata_server: http://10.13.114.102:35880/metadata
    mooncake_master_server_addr: 10.13.114.102:35551
    mooncake_local_hostname: 10.13.114.102
    mooncake_protocol: tcp
