model:
  target_model_path: /workspace/models/Kimi-K3-cdd2e49a
  draft_model_config: configs/kimi-k3-dspark-4kda-1mla.json
  target_backend: sglang
  trust_remote_code: true
  embedding_key: language_model.model.embed_tokens.weight
  lm_head_key: language_model.lm_head.weight
  mask_token_id: 163824
  torch_dtype: bfloat16
  sglang_attention_backend: flashinfer
  sglang_mem_fraction_static: 0.76
  sglang_context_length: 4608
  sglang_max_running_requests: 8
  sglang_max_total_tokens: 40960
  sglang_moe_runner_backend: marlin
  sglang_enable_symm_mem: true
  sglang_mamba_radix_cache_strategy: extra_buffer
  sglang_max_mamba_cache_size: 40

data:
  train_data_path: /workspace/k3_dspark/data/kimi-k3-openperfectblend-regen-439c2fdc/data.jsonl
  max_length: 4096
  chat_template: kimi-k3-thinking
  cache_dir: /workspace/k3_dspark/cache
  build_dataset_num_proc: 64
  dataloader_num_workers: 0

training:
  strategy: dspark
  num_epochs: 10
  batch_size: 8
  accumulation_steps: 32
  learning_rate: 0.0006
  warmup_ratio: 0.04
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  save_interval: 250
  log_interval: 10
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge-dspark
  wandb_name: kimi-k3-dspark-4kda-1mla-openperfectblend-disaggregated
  wandb_offline: false
  wandb_dir: /workspace/k3_dspark/runs/kimi-k3-4kda-1mla-openperfectblend/wandb

runtime:
  producer_lease: 1
  producer_concurrency: 8
  in_flight_high_watermark: 64
  in_flight_low_watermark: 32
  resident_high_watermark_bytes: 34359738368
  resident_low_watermark_bytes: 17179869184
  feature_store_max_resident_bytes: 68719476736

run_id: kimi-k3-dspark-4kda-1mla-openperfectblend-disaggregated
output_dir: /workspace/k3_dspark/runs/kimi-k3-4kda-1mla-openperfectblend/output

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 4
  disaggregated:
    control_dir: /workspace/k3_dspark/runs/kimi-k3-4kda-1mla-openperfectblend/control
    consumer_state_dir: /workspace/k3_dspark/runs/kimi-k3-4kda-1mla-openperfectblend/consumer-state
    backend: mooncake
    store_id: kimi-k3-dspark-4kda-1mla-openperfectblend-disaggregated
    server_urls:
      - http://10.65.0.2:30000
    mooncake_metadata_server: http://10.65.0.2:35880/metadata
    mooncake_master_server_addr: 10.65.0.2:35551
    mooncake_protocol: tcp
    client_buffer_size: 1073741824
    idle_timeout_s: 7200
    peer_wait_timeout_s: 7200
