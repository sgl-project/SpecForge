model:
  target_model_path: deepseek-ai/DeepSeek-V4-Flash-0731
  draft_model_config: configs/deepseek-v4-flash-dspark.json
  target_backend: sglang
  trust_remote_code: true
  # Weights-only warm start (optimizer state and prompt position reset).
  # Originally the 4-rank run's step-1024 checkpoint; now this run's own
  # step-256 checkpoint after a missed exact-resume window. Mutually
  # exclusive with training.resume_from.
  draft_checkpoint_path: outputs/deepseek-v4-flash-dspark-0813-32k-r2/deepseek-v4-flash-dspark-0813-32k-r2-step256
  # DeepSeek-V4 checkpoints use the native inference weight layout.
  embedding_key: embed.weight
  lm_head_key: head.weight
  mask_token_id: 128799
  torch_dtype: bfloat16
  sglang_mem_fraction_static: 0.88
  # data.max_length plus headroom: capture rejects inputs at exactly the
  # context length.
  sglang_context_length: 33280
  sglang_max_running_requests: 8
  # The checkpoint's routed experts are fp4 (`expert_dtype: "fp4"`); the
  # default MoE path cannot run them on B200.
  sglang_moe_runner_backend: flashinfer_mxfp4

data:
  # Recorded DSV4-Flash production traffic (2026-08-13), rendered with the
  # native encoding_dsv4 encoder (scripts/transform_traffic_recordings.py)
  # and trimmed to <=32768 tokens at complete-turn boundaries
  # (scripts/trim_dataset_to_max_tokens.py) so no supervised span is cut
  # mid-tool-call and every row keeps its trailing EOS. ~89% of rows survive
  # the trim; median row is ~30K tokens / 8 assistant turns.
  train_data_path: ./cache/dataset/dsv4_flash_0813_32k_train.jsonl
  is_preformatted: true
  max_length: 32768
  chat_template: deepseek-v4
  cache_dir: cache
  cache_key: dsv4-flash-0813-32k-full
  build_dataset_num_proc: 64
  # Full corpus: 418,234 trimmed rows. The one-time dataset build tokenizes
  # every row (a prefix re-encode per assistant span), ~4-5 h at 64 procs;
  # it lands in the Arrow cache under cache_key and is instant afterwards.
  # For a quick smoke run, set data.max_prompts (e.g. 5000) to slice the
  # dataset BEFORE tokenization.
  # 16 fetch threads/rank: a 32K step moves ~25 GiB per rank and one loopback
  # TCP stream tops out ~0.3-0.6 GB/s; sink throughput scales with stream
  # count (measured ~3.1 GB/s/sink at 16 streams).
  dataloader_num_workers: 16

training:
  strategy: dspark
  # Exact resume (training.resume_from) is CONSUMER-ONLY: it needs the ack
  # marker to equal the checkpoint step AND the original producer still
  # running (a producer restart claims a fresh control path and a SIGTERMed
  # producer poisons the channel). After a full-stack stop, the supported
  # path is a weights-only warm start from the latest checkpoint via
  # model.draft_checkpoint_path with a fresh ledger and store_id.
  num_epochs: 4
  # Rows are ~4x the 8K ShareGPT recipe, so the optimizer quantum shrinks
  # 2x to keep feature bytes bounded: 2 ranks x 32 microbatches -> 64
  # sequences per step. Two trainer ranks free GPUs 4-5 for a third capture
  # server: at 32K one TP2 server prefills ~1 seq/s, so capture (not compute
  # or transfer) binds a 4-rank trainer; 3 servers x ~0.95/s matches a
  # 2-rank consumer's ~2.9 samples/s. Features run ~48KB/token (5 aux layers + pre-head at
  # width 4096, bf16): ~1.4 GiB per median sample, 1.6 GiB at the 32K cap.
  batch_size: 1
  accumulation_steps: 32
  learning_rate: 0.0006
  lr_scheduler: constant
  warmup_ratio: 0
  max_grad_norm: 1
  attention_backend: flex_attention
  num_anchors: 512
  loss_decay_gamma: 4.0
  objective_chunk_blocks: 128
  dspark_ce_loss_alpha: 0.1
  dspark_l1_loss_alpha: 0.9
  dspark_confidence_head_alpha: 1.0
  # ~26K optimizer steps over 4 epochs at ~100 x 15 GiB of checkpoints; 256
  # also bounds the pause window (exact resume requires ack == checkpoint).
  save_interval: 256
  log_interval: 5
  dist_timeout: 30
  seed: 42
  prompt_seed: 1

tracking:
  report_to: wandb
  wandb_project: specforge
  wandb_name: deepseek-v4-flash-dspark-0813-32k-r2
  wandb_dir: outputs/deepseek-v4-flash-dspark-0813-32k-r2/wandb

runtime:
  # Lease commitment is the real backpressure overshoot: once dispatch
  # resumes, workers(3) x concurrency x lease samples are committed and
  # publish regardless of the watermark (observed 2026-08-22: a 152-lease
  # refill burst pushed resident 218 -> 406 GB and tripped the hard cap).
  # 3 x 4 x 4 = 48 samples (~82 GiB at the 1.7 GiB cap) keeps the peak at
  # high watermark + commitment ~= 254 GB, well under the 384 GiB cap,
  # and 16 outstanding prompts per server still covers the 8 running
  # slots (max_running_requests) with a full queue behind them.
  producer_lease: 4
  producer_concurrency: 4
  # One optimizer quantum is 64 samples (~90 GiB of features at the ~30K
  # median). Two quanta stay in flight so the producer runs a window ahead;
  # the low watermark holds one full quantum so complete optimizer windows
  # always dispatch without a backpressure deadlock.
  # Resume capture well before the buffer nears one quantum: with 8 fetch
  # clients the consumer drains ~2.9 samples/s while 4x4 leases ramp capture
  # gently, and a low watermark at exactly one quantum (64) let in_flight
  # scrape 47 and starve full optimizer windows (observed 2026-08-23:
  # 22 s steps spiking to 35 s). Narrow hysteresis keeps a steady trickle.
  in_flight_high_watermark: 128
  in_flight_low_watermark: 112
  # Backpressure gates only NEW dispatches: the high watermark plus the
  # full lease commitment (workers x producer_concurrency x producer_lease
  # x 1.7 GiB/sample) must stay under the hard cap, and the hard cap under
  # the 3x192 GiB sink segments.
  resident_high_watermark_bytes: 171798691840     # 160 GiB
  resident_low_watermark_bytes: 161061273600      # 150 GiB (narrow band, see above)
  feature_store_max_resident_bytes: 412316860416  # 384 GiB

run_id: deepseek-v4-flash-dspark-0813-32k-r2
output_dir: outputs/deepseek-v4-flash-dspark-0813-32k-r2

deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 2
  disaggregated:
    control_dir: outputs/deepseek-v4-flash-dspark-0813-32k-r2/control
    consumer_state_dir: outputs/deepseek-v4-flash-dspark-0813-32k-r2/consumer-state
    backend: mooncake
    store_id: deepseek-v4-flash-dspark-0813-32k-a10
    # Two TP2 capture servers out-produce one TP4 server (TP prefill scaling
    # is sublinear) and keep the producer ahead of a four-rank consumer.
    server_urls:
      - http://127.0.0.1:30000
      - http://127.0.0.1:30001
      - http://127.0.0.1:30002
    mooncake_metadata_server: http://127.0.0.1:35880/metadata
    mooncake_master_server_addr: 127.0.0.1:35551
    mooncake_local_hostname: 127.0.0.1
    mooncake_protocol: tcp
    # A 32K sample is ~1.6 GiB transferred as one object; the client buffer
    # must hold it (the 8K recipe's 1 GiB would fail the fetch).
    client_buffer_size: 2147483648
    # Must cover the one-time full-corpus tokenization (~3-4 h at 64 procs):
    # consumer ranks wait on the producer's schedule file for this long before
    # a cold-cache first launch is declared dead.
    idle_timeout_s: 21600
    peer_wait_timeout_s: 21600
