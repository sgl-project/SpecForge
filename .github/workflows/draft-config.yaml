name: Draft configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install configuration dependencies
        run: python -m pip install 'pydantic>=2,<3' pyyaml
      - name: Test draft configuration without compute dependencies
        run: python -m unittest discover -s tests/test_config -p 'test_draft_*.py' -v

  codec-parity:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install CPU model dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==5.19.0 'pydantic>=2,<3' pyyaml
      - name: Test canonical model composition and rotary parity on CPU
        run: >-
          python -m unittest
          tests.test_modeling.test_canonical_eagle3
          tests.test_modeling.test_canonical_peagle
          tests.test_modeling.test_draft_mtp_codec
          tests.test_modeling.test_draft_scaled_rotary -v
      - name: Test checkpoint loading and publication on CPU
        run: python -m unittest discover -s tests/test_checkpoint -t . -v
      - name: Test canonical training objectives on CPU
        run: >-
          python -m unittest
          tests.test_algorithms.test_objectives
          tests.test_algorithms.test_objective_contracts
          tests.test_algorithms.test_predictions
          tests.test_algorithms.test_acceptance_losses
          tests.test_algorithms.test_objective_legacy_parity
          tests.test_algorithms.test_chunked_reduction
          tests.test_algorithms.test_loss_execution
          tests.test_algorithms.test_loss_plan -v
