name: Draft configuration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  draft-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install run-schema dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Test draft configuration without compute dependencies
        run: python -m unittest discover -s tests/test_config -p 'test_draft_*.py' -v
