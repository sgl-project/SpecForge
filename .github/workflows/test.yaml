name: PR Test

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: pr-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cleanup-runner:
    if: (github.repository == 'sgl-project/SpecForge' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false
    runs-on: [self-hosted]
    concurrency:
      group: specforge-gpu-ci
      cancel-in-progress: false
      queue: max
    timeout-minutes: 5
    steps:
      # Job containers need a fresh Docker network before any container step can
      # run, so stale networks must be pruned in a host-side prerequisite job.
      - name: Prune stale Docker networks
        shell: bash
        run: docker network prune --force --filter "until=1h"

  unit-test:
    needs: cleanup-runner
    if: (github.repository == 'sgl-project/SpecForge' || github.event_name == 'pull_request') &&
        github.event.pull_request.draft == false
    runs-on: [self-hosted]
    concurrency:
      group: specforge-gpu-ci
      cancel-in-progress: false
      queue: max
    container:
      image: lmsysorg/sglang:v0.5.18-cu130 # CUDA build-toolchain base; the venvs install the pinned SGLang revision below
      options: --gpus all --shm-size=2g --rm -v /dev/shm --privileged --pid=host
    # The self-hosted runner exports HTTP(S)_PROXY into the container but no
    # longer a NO_PROXY, so local requests (sglang's own warmup to 127.0.0.1)
    # went through the proxy and got 502. Keep loopback off the proxy here
    # instead of relying on the runner's environment. (Actions env keys are
    # case-insensitive, so no separate no_proxy; Python reads either case.)
    env:
      NO_PROXY: localhost,127.0.0.1,::1
      # v2 deliberately ignores the legacy venv cache with stale dist-info files.
      SPECFORGE_CI_CACHE: /github/home/specforge-ci-v2
      FLASH_ATTN_VERSION: 2.8.3.post2
      # Both CI environments need the plugin's forward-observer/completion APIs.
      SGLANG_COMMIT: c757c4bb7c55d1eb69fdb2bdc6e6fb8507acb7a0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # checkout@v4 whitelists the workspace only in its own temporary git
      # config; later steps that build the package with --no-build-isolation
      # invoke git again (setuptools-scm's file finder) and fail with
      # "detected dubious ownership" on this self-hosted container. HOME
      # persists across jobs here, so add the entry only once.
      - name: Trust the workspace for later git calls
        shell: bash
        run: |
          git config --global --fixed-value --get safe.directory "$GITHUB_WORKSPACE" >/dev/null ||
            git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Cancelled or timed-out runs can leave processes behind which keep GPU
      # memory allocated and make this run OOM. --pid=host above is what makes
      # those leftovers visible from inside the container.
      - name: Kill leftover GPU processes
        timeout-minutes: 5
        shell: bash
        run: bash .github/workflows/scripts/kill_gpu_procs.sh

      - name: Restore cache
        run: |
          if [ -d /github/home/cache ] && [ ! -z "$(ls -A /github/home/cache/)" ]; then
            cp -p -r /github/home/cache ./
          fi

          for environment in sf sf-capture; do
            if [ -d "$SPECFORGE_CI_CACHE/$environment" ]; then
              rm -rf "$environment"
              cp -a "$SPECFORGE_CI_CACHE/$environment" "$environment"
            fi
          done

      - name: Remove flashinfer # this is needed to avoid flashinfer jit compilation makes the program hang
        run: |
          rm -rf /github/home/.cache/flashinfer

      - name: Install capture server Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pinned SGLang revision's rust/rust-toolchain.toml requirement.
          toolchain: "1.92"

      - name: Install dependencies
        shell: bash
        run: |
          # if sf venv does not exist, create it
          if [ ! -d sf ]; then
            uv venv sf -p 3.11
          fi
          source sf/bin/activate
          uv pip install wheel setuptools setuptools-rust setuptools-scm psutil packaging ninja
          uv pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cu130
          uv pip install -v . --no-build-isolation --prerelease=allow \
            "sglang @ git+https://github.com/sgl-project/sglang.git@${SGLANG_COMMIT}#subdirectory=python"
          uv pip install --no-deps plugins/sglang-spec-capture
          # The live server-capture gate needs the Mooncake client AND the
          # mooncake_master console script; the isolated venv cannot see the
          # container's site-packages. cu130 image -> the cuda13 wheel.
          uv pip install mooncake-transfer-engine-cuda13

      - name: Install pinned plugin capture environment
        timeout-minutes: 30
        shell: bash
        run: |
          if [ ! -d sf-capture ]; then
            uv venv sf-capture -p 3.12
          fi
          # Use the same CI-owned revision as sf, with ordinary cache reuse.
          uv pip install --python sf-capture/bin/python wheel setuptools setuptools-rust setuptools-scm
          uv pip install --python sf-capture/bin/python torch==2.14.1 --index-url https://download.pytorch.org/whl/cu130
          uv pip install --python sf-capture/bin/python --no-build-isolation --prerelease=allow \
            "sglang @ git+https://github.com/sgl-project/sglang.git@${SGLANG_COMMIT}#subdirectory=python" mooncake-transfer-engine-cuda13
          uv pip install --python sf-capture/bin/python --no-deps plugins/sglang-spec-capture
          sf-capture/bin/python -c 'from sglang.srt.model_executor.forward_observer import ForwardObserver; from sglang.srt.managers.deferred_output import ResponseCompletion'

      - name: Ensure FlashAttention ABI
        timeout-minutes: 30
        shell: bash
        run: |
          source sf/bin/activate
          bash .github/workflows/scripts/ensure_flash_attention.sh

      - name: Save dependency cache
        shell: bash
        run: |
          # Publish a complete snapshot, never merge into the previous venv.
          # Save before tests so a test failure does not discard a valid FA build.
          mkdir -p "$SPECFORGE_CI_CACHE"
          staging=$(mktemp -d "$SPECFORGE_CI_CACHE/sf.XXXXXX")
          trap 'rm -rf "$staging"' EXIT
          for environment in sf sf-capture; do
            cp -a "$environment" "$staging/$environment"
            rm -rf "${SPECFORGE_CI_CACHE:?}/$environment"
            mv "$staging/$environment" "$SPECFORGE_CI_CACHE/$environment"
          done

      - name: Run live server-capture numerics gate
        timeout-minutes: 15
        shell: bash
        env:
          SPECFORGE_RUN_SERVER_CAPTURE_TESTS: "1"
        run: |
          source sf/bin/activate
          export PYTHONPATH=$PWD
          export SPECFORGE_SERVER_CAPTURE=plugin
          export SPECFORGE_CAPTURE_GATE_SERVER_PYTHON="$PWD/sf-capture/bin/python"
          python -c 'import importlib.util, shutil, torch; assert torch.cuda.is_available(), "live capture gate requires CUDA"; assert importlib.util.find_spec("mooncake.store"), "live capture gate requires mooncake.store"; assert shutil.which("mooncake_master") or __import__("os").environ.get("MOONCAKE_MASTER_SERVER_ADDR"), "live capture gate requires mooncake_master"'
          python -m unittest tests.test_runtime.test_server_capture_gate -v

      - name: Run Liger kernel tests
        timeout-minutes: 10
        shell: bash
        run: |
          source sf/bin/activate
          export PYTHONPATH=$PWD
          # test_training is not a package, so discovery does not collect it.
          python -m unittest tests.test_training.test_liger_kernel -v

      - name: Run test
        timeout-minutes: 45
        shell: bash
        run: |
          source sf/bin/activate
          export PYTHONPATH=$PWD
          python -m unittest discover -s ./tests -p "test_*.py" -v

      - name: Save cache
        run: |
          cp -p -r cache /github/home/
