[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
description = "SpecForge: Speculative Decoding Training Framework"
authors = [{name = "SGLang Team"}]
urls = {Homepage = "https://github.com/sgl-project/SpecForge"}
dependencies = [
    "transformers==5.12.1",
    "datasets",
    "tqdm",
    "accelerate",
    "click>=8.0",
    "huggingface-hub",
    "numpy",
    "pydantic",
    "psutil",
    "pyyaml",
    "safetensors",
    "requests",
    "typing-extensions",
    "tensorboard",
    "wandb",
    "yunchang",
    "openai-harmony",
    "openai",
]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[project.optional-dependencies]
cuda = [
    "sglang==0.5.18",
    "torch==2.13.0",
    "sglang-kernel==0.4.6.post1",
    "mooncake-transfer-engine-cuda13"
]
rocm = [
    "torch==2.13.0+rocm7.2",
    "triton-rocm==3.7.1; sys_platform == 'linux' and python_version < '3.15'",
]
xpu = [
    # XPU SGLang comes from the Intel container, not the CUDA PyPI build.
    "torch==2.13.0+xpu",
    "triton-xpu==3.7.2",
    "yunchang",
]
npu = [
    # The NPU build of SGLang, sgl_kernel_npu and hccl are not on PyPI; they
    # come from the CANN / SGLang-NPU stack. See docs/sections/basic_usage/Ascend.
    "torch==2.13.0+cpu",
    "torch_npu==2.13.0rc1",
    "triton==3.5.0",
    "triton_ascend==3.2.0",
]
dev = [
    "pre-commit",
]
fa = ["flash-attn", "ninja", "packaging"]
liger = ["liger-kernel"]

[tool.uv]
# Each accelerator uses a different PyTorch build and wheel index.
conflicts = [
    [
        { extra = "cuda" },
        { extra = "rocm" },
        { extra = "npu" },
        { extra = "xpu" },
    ],
]

[tool.uv.sources]
yunchang = [
    { git = "https://github.com/feifeibear/long-context-attention.git", extra = "xpu" },
]
# ROCm PyTorch requires Triton wheels from the same vendor index.
triton-rocm = { index = "pytorch-rocm", extra = "rocm" }
triton-xpu = { index = "pytorch-xpu", extra = "xpu" }
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cu130", extra = "cuda" },
    { index = "pytorch-cpu", extra = "npu" },
    { index = "pytorch-xpu", extra = "xpu" },
]
sglang-kernel = [
    { index = "sglang-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[[tool.uv.index]]
name = "sglang-cu130"
url = "https://sgl-project.github.io/whl/cu130/"
explicit = true


[tool.setuptools.dynamic]
version = {file = "version.txt"}
