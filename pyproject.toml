[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
description = "SpecForge: Speculative Decoding Training Framework"
authors = [{name = "SGLang Team"}]
urls = {Homepage = "https://github.com/sgl-project/SpecForge"}
dependencies = [
    "transformers==5.12.1",
    "datasets",
    "tqdm",
    "accelerate",
    "click>=8.0",
    "huggingface-hub",
    "numpy",
    "pydantic",
    "psutil",
    "pyyaml",
    "safetensors",
    "requests",
    "typing-extensions",
    "tensorboard",
    "wandb",
    "yunchang",
    "openai-harmony",
    "openai",
    "sglang==0.5.18",
]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[project.optional-dependencies]
cuda = [
    "torch==2.13.0",
    "sglang-kernel==0.4.6.post1",
    "mooncake-transfer-engine-cuda13"
]
rocm = [
    "torch==2.13.0+rocm7.2",
]
dev = [
    "pre-commit",
]
fa = ["flash-attn", "ninja", "packaging"]
liger = ["liger-kernel"]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cu130", extra = "cuda" },
]
sglang-kernel = [
    { index = "sglang-cu130", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "sglang-cu130"
url = "https://sgl-project.github.io/whl/cu130/"
explicit = true


[tool.setuptools.dynamic]
version = {file = "version.txt"}
