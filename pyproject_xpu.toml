[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specforge"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.11"
description = "SpecForge: Speculative Decoding Training Framework"
authors = [{name = "SGLang Team"}]
urls = {Homepage = "https://github.com/sgl-project/SpecForge"}
dependencies = [
    "torch==2.14.1+xpu",
    "transformers==5.19.0",
    "datasets",
    "tqdm",
    "accelerate",
    "click>=8.0",
    "huggingface-hub",
    "numpy",
    "openai-harmony",
    "pydantic",
    "psutil",
    "pyyaml",
    "safetensors",
    # Install an XPU-compatible SGLang main build and the capture plugin separately.
    "requests",
    "tensorboard",
    "typing-extensions",
    "wandb",
    "yunchang @ git+https://github.com/feifeibear/long-context-attention.git",
]

[project.scripts]
specforge = "specforge.cli:main"

[tool.setuptools.packages.find]
include = ["specforge*"]

[project.optional-dependencies]
data = ["openai"]
dev = [
    "pre-commit",
]
fa = ["flash-attn", "ninja", "packaging"]
liger = ["liger-kernel>=0.8.3,<0.9"]

[tool.setuptools.dynamic]
version = {file = "version.txt"}
