schema_version: 1
model_type: specforge_draft
architectures:
- Eagle3DraftModel
extensions: []
hidden_size: 8192
vocab_size: 128256
draft_vocab_size: 32000
max_position_embeddings: 4096
initializer_range: 0.02
tie_word_embeddings: false
attention_configs:
  default:
    type: gqa
    rope_parameters: null
    num_attention_heads: 64
    num_key_value_heads: 8
    head_dim: 128
    qk_norm: false
    qk_norm_position: before_rope
    qk_norm_scope: head
    qk_norm_config: null
    attention_bias: false
    output_gate: false
    is_causal: true
    sliding_window: null
    attention_dropout: 0.0
mlp_configs:
  default:
    type: dense
    intermediate_size: 28672
    hidden_act: silu
conv_configs: {}
layer_configs:
  default:
    attention: default
    mlp: default
    sublayer_conv: null
layer_types:
- default
num_hidden_layers: 1
norm_config:
  type: rms
  has_weight: true
  eps: 1.0e-05
  weight_offset: 0
residual_config:
  type: standard
rope_parameters:
  rope_type: llama3
  interleaved: false
  rope_theta: 500000.0
  partial_rotary_factor: 1.0
  factor: 8.0
  low_freq_factor: 1.0
  high_freq_factor: 4.0
  original_max_position_embeddings: 4096
spec_config:
  target_features:
    target_layer_ids:
    - 1
    - 39
    - 76
    hidden_size: 8192
  normalize_features: false
  norm_output: false
target_bindings:
- embed_tokens
