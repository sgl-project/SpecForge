schema_version: 1
model_type: specforge_draft
architectures:
- Eagle3DraftModel
extensions: []
hidden_size: 2048
vocab_size: 102400
draft_vocab_size: 32000
max_position_embeddings: 163840
initializer_range: 0.02
tie_word_embeddings: false
attention_configs:
  default:
    type: gqa
    rope_parameters: null
    num_attention_heads: 16
    num_key_value_heads: 16
    head_dim: 128
    qk_norm: false
    attention_bias: false
    output_gate: false
    is_causal: true
    sliding_window: null
    attention_dropout: 0.0
mlp_configs:
  default:
    type: dense
    intermediate_size: 10944
    hidden_act: silu
conv_configs: {}
layer_configs:
  default:
    attention: default
    mlp: default
    sublayer_conv: null
layer_types:
- default
num_hidden_layers: 1
norm_config:
  type: rms
  eps: 1.0e-06
  weight_offset: 0
residual_config:
  type: standard
rope_parameters:
  rope_type: yarn
  rope_theta: 10000
  partial_rotary_factor: 1.0
  factor: 40.0
  original_max_position_embeddings: 4096
  attention_factor: 1.0
  beta_fast: 32.0
  beta_slow: 1.0
  truncate: true
  mscale_all_dim: 0.0
spec_config:
  target_features:
    target_layer_ids:
    - 1
    - 12
    - 23
    hidden_size: 2048
  normalize_features: false
  norm_output: false
target_bindings:
- embed_tokens
