<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">DFlash2 drafting and verification</title>
  <desc id="desc">An anchor and masked slots enter a parallel draft with dynamic convolutions. Top-k candidates feed a low-rank selector. The target verifies the selected path, then commits the accepted prefix.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#52647a"/></marker>
  </defs>
  <rect width="920" height="360" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="460" y="32" font-size="23" font-weight="700" fill="#172b45">DFlash2: parallel prediction, coherent selection</text>
    <g stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M270 113H327"/><path d="M585 113H642"/><path d="M775 164V215"/>
      <path d="M650 270H593"/><path d="M335 270H278"/>
    </g>
    <g stroke-width="1.5">
      <rect x="20" y="62" width="250" height="102" rx="12" fill="#eaf1fb" stroke="#91aacd"/>
      <rect x="335" y="62" width="250" height="102" rx="12" fill="#ede9fe" stroke="#a395df"/>
      <rect x="650" y="62" width="250" height="102" rx="12" fill="#ede9fe" stroke="#a395df"/>
      <rect x="650" y="219" width="250" height="102" rx="12" fill="#ede9fe" stroke="#a395df"/>
      <rect x="335" y="219" width="250" height="102" rx="12" fill="#eaf1fb" stroke="#91aacd"/>
      <rect x="20" y="219" width="250" height="102" rx="12" fill="#e3f5ee" stroke="#82b6a3"/>
    </g>
    <g fill="#172b45" font-size="21" font-weight="700">
      <text x="145" y="99">Draft inputs</text><text x="460" y="99">Parallel draft</text><text x="775" y="99">Candidate sets</text>
      <text x="775" y="256">Low-rank selector</text><text x="460" y="256">Target verification</text><text x="145" y="256">Accepted prefix</text>
    </g>
    <g fill="#40546b" font-size="18">
      <text x="145" y="129">Anchor + masked slots</text><text x="145" y="151">Target context features</text>
      <text x="460" y="129">Attention + dynamic conv</text><text x="460" y="151">One backbone forward</text>
      <text x="775" y="129">Top-k at each position</text><text x="775" y="151">Unary token scores</text>
      <text x="775" y="286">Score adjacent token pairs</text><text x="775" y="308">Choose a candidate path</text>
      <text x="460" y="286">Check the selected path</text><text x="460" y="308">Apply sampling rules</text>
      <text x="145" y="286">Commit accepted tokens</text><text x="145" y="308">Begin the next cycle</text>
    </g>
  </g>
</svg>
