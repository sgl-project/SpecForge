<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">DMTP: MTP first, then parallel continuation</title>
  <desc id="desc">Native MTP uses target context and the last emitted token A to propose T1. T1 and its predictor state condition a DFlash-family draft. In the 27B release it proposes T2 through T7, and the target verifies all seven candidates.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="#52647a"/></marker>
  </defs>
  <rect width="920" height="390" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="460" y="32" font-size="23" font-weight="700" fill="#172b45">DMTP: native MTP first, parallel draft next</text>
    <g stroke="#52647a" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M270 113H327"/><path d="M585 113H642"/><path d="M775 164V215"/>
      <path d="M650 270H593"/><path d="M335 270H278"/>
    </g>
    <g stroke-width="1.5">
      <rect x="20" y="62" width="250" height="102" rx="12" fill="#eaf1fb" stroke="#91aacd"/>
      <rect x="335" y="62" width="250" height="102" rx="12" fill="#e3f5ee" stroke="#82b6a3"/>
      <rect x="650" y="62" width="250" height="102" rx="12" fill="#e3f5ee" stroke="#82b6a3"/>
      <rect x="650" y="219" width="250" height="102" rx="12" fill="#ede9fe" stroke="#a395df"/>
      <rect x="335" y="219" width="250" height="102" rx="12" fill="#eaf1fb" stroke="#91aacd"/>
      <rect x="20" y="219" width="250" height="102" rx="12" fill="#e3f5ee" stroke="#82b6a3"/>
    </g>
    <g fill="#172b45" font-size="21" font-weight="700">
      <text x="145" y="99">Starting context</text><text x="460" y="99">Frozen native MTP</text><text x="775" y="99">First-candidate input</text>
      <text x="775" y="256">DFlash-family draft</text><text x="460" y="256">Target verification</text><text x="145" y="256">Accepted prefix</text>
    </g>
    <g fill="#40546b" font-size="18">
      <text x="145" y="129">Aligned target state</text><text x="145" y="151">Last emitted token A</text>
      <text x="460" y="129">One prediction step</text><text x="460" y="151">Propose T1</text>
      <text x="775" y="129">T1 + predictor state</text><text x="775" y="151">Condition the T1 slot</text>
      <text x="775" y="286">Read target context too</text><text x="775" y="308">Propose T2 ... T7 in parallel</text>
      <text x="460" y="286">Verify T1 ... T7 together</text><text x="460" y="308">Commit or roll back caches</text>
      <text x="145" y="286">Commit accepted tokens</text><text x="145" y="308">Begin the next cycle</text>
    </g>
    <text x="460" y="360" fill="#40546b" font-size="18">27B example: [A, T1, MASK × 6] → seven new proposals; A is already emitted.</text>
  </g>
</svg>
